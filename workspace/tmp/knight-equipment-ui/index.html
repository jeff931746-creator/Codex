<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>骑士装备界面示意</title>
  <style>
    :root {
      --bg-top: #273346;
      --bg-bottom: #131823;
      --panel: rgba(248, 244, 226, 0.94);
      --panel-dark: #6a442c;
      --gold: #f6c65a;
      --gold-deep: #b87a22;
      --ink: #332319;
      --muted: #7b6a54;
      --green: #47b56e;
      --purple: #8d65df;
      --red: #d45757;
      --blue: #4b82d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 10%, rgba(98, 160, 220, 0.26), transparent 28%),
        radial-gradient(circle at 78% 12%, rgba(246, 198, 90, 0.22), transparent 24%),
        linear-gradient(160deg, #1d2635, #10131d 72%);
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
    }

    .screen {
      position: relative;
      width: min(94vw, 430px);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border: 4px solid #1d1713;
      border-radius: 18px;
      background:
        linear-gradient(rgba(255,255,255,0.08), rgba(255,255,255,0)),
        radial-gradient(circle at 50% 22%, rgba(246, 198, 90, 0.18), transparent 35%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(180deg, transparent, black 20%, black 80%, transparent);
      pointer-events: none;
    }

    .topbar {
      position: relative;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff6dd;
      text-shadow: 0 3px 0 #3a1d13, 0 0 18px rgba(246,198,90,0.55);
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0;
      background: linear-gradient(180deg, rgba(85, 52, 31, 0.92), rgba(42, 24, 18, 0.86));
      border-bottom: 3px solid #b88436;
    }

    .info {
      width: 30px;
      height: 30px;
      margin-left: 12px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 22px;
      color: white;
      background: linear-gradient(#67a8ff, #265ac6);
      border: 3px solid #f6d07a;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    }

    .content {
      position: relative;
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 10px;
      padding: 10px 12px 76px;
      height: calc(100% - 66px);
    }

    .tabs {
      padding: 8px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(244,236,205,0.96), rgba(203,184,135,0.94));
      border: 3px solid #2b2118;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35), 0 6px 0 rgba(0,0,0,0.26);
    }

    .tab {
      height: 42px;
      display: grid;
      place-items: center;
      margin-bottom: 8px;
      border-radius: 10px;
      color: #fff4de;
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(#915d33, #4b2b1e);
      border: 2px solid #21160f;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.24);
      text-shadow: 0 2px 0 rgba(0,0,0,0.45);
    }

    .tab.active {
      color: #3b2114;
      background: linear-gradient(#fff6ce, #e3b352);
      border-color: #623815;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.55), 0 0 12px rgba(246,198,90,0.8);
      text-shadow: none;
    }

    .main {
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-width: 0;
    }

    .hero-area {
      position: relative;
      height: 206px;
      border-radius: 14px;
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 228, 120, 0.45), transparent 35%),
        linear-gradient(180deg, rgba(73, 93, 140, 0.82), rgba(33, 39, 65, 0.92));
      border: 3px solid #1f1712;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.16), 0 8px 0 rgba(0,0,0,0.22);
      overflow: hidden;
    }

    .hero-area::before {
      content: "";
      position: absolute;
      inset: 16px 50px;
      border: 3px solid rgba(246,198,90,0.45);
      border-radius: 50%;
      box-shadow: 0 0 28px rgba(246,198,90,0.4);
    }

    .knight {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 132px;
      height: 178px;
      transform: translateX(-50%);
      filter: drop-shadow(0 14px 14px rgba(0,0,0,0.45));
    }

    .helmet {
      position: absolute;
      left: 38px;
      top: 2px;
      width: 62px;
      height: 58px;
      border-radius: 30px 30px 14px 14px;
      background: linear-gradient(135deg, #f9d66d, #9b6c2b);
      border: 4px solid #433024;
    }

    .visor {
      position: absolute;
      left: 44px;
      top: 18px;
      width: 44px;
      height: 34px;
      clip-path: polygon(0 0, 100% 0, 82% 80%, 50% 100%, 18% 80%);
      background: linear-gradient(#384152, #171d29);
      border: 3px solid #eee0b7;
    }

    .cape {
      position: absolute;
      left: 18px;
      top: 46px;
      width: 96px;
      height: 132px;
      background: linear-gradient(180deg, #2f62c9, #1b315f);
      clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%);
      border-radius: 12px;
    }

    .body {
      position: absolute;
      left: 31px;
      top: 55px;
      width: 70px;
      height: 108px;
      border-radius: 25px 25px 16px 16px;
      background: linear-gradient(135deg, #c8b686, #736b62);
      border: 4px solid #3b3028;
    }

    .pauldron {
      position: absolute;
      top: 64px;
      width: 46px;
      height: 30px;
      border-radius: 22px;
      background: linear-gradient(#ffd863, #b87922);
      border: 4px solid #5a3616;
    }

    .pauldron.left {
      left: 14px;
      transform: rotate(-18deg);
    }

    .pauldron.right {
      right: 14px;
      transform: rotate(18deg);
    }

    .sword {
      position: absolute;
      left: 61px;
      top: 108px;
      width: 12px;
      height: 76px;
      background: linear-gradient(90deg, #e9eef2, #8b99a6);
      border: 2px solid #34393e;
      border-radius: 4px;
    }

    .guard {
      position: absolute;
      left: 39px;
      top: 100px;
      width: 54px;
      height: 16px;
      border-radius: 8px;
      background: linear-gradient(#ffd95e, #b46d1d);
      border: 3px solid #4e2e14;
    }

    .slot {
      position: absolute;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      transform: rotate(45deg);
      border: 4px solid #231710;
      background: linear-gradient(135deg, #f4f0dc, #c7b58a);
      box-shadow: 0 4px 0 rgba(0,0,0,0.28), inset 0 0 0 2px rgba(255,255,255,0.36);
    }

    .slot.filled {
      background: linear-gradient(135deg, #4f8ee3, #224d9e);
      border-color: #f2c059;
    }

    .slot.green {
      background: linear-gradient(135deg, #54bf75, #28754e);
    }

    .slot.red {
      background: linear-gradient(135deg, #e16a5f, #933436);
    }

    .slot .icon {
      transform: rotate(-45deg);
      text-align: center;
      color: white;
      font-weight: 900;
      text-shadow: 0 2px 2px rgba(0,0,0,0.55);
      font-size: 12px;
    }

    .slot .armor {
      width: 32px;
      height: 28px;
      margin: 0 auto 1px;
      border-radius: 6px 6px 10px 10px;
      background: linear-gradient(#fff3a4 0 28%, #4e96f0 29% 72%, #f5c845 73%);
      border: 2px solid rgba(45,28,16,0.7);
    }

    .s1 { left: 26px; top: 22px; }
    .s2 { right: 26px; top: 22px; }
    .s3 { left: 34px; bottom: 30px; }
    .s4 { right: 34px; bottom: 30px; }
    .s5 { left: 34px; top: 98px; }
    .s6 { right: 34px; top: 98px; }

    .panel {
      border: 3px solid #231710;
      border-radius: 14px;
      background: var(--panel);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.52), 0 5px 0 rgba(0,0,0,0.24);
      overflow: hidden;
    }

    .panel-title {
      height: 30px;
      display: grid;
      place-items: center;
      color: #fff2c6;
      font-size: 18px;
      font-weight: 900;
      background: linear-gradient(#8d5a30, #4f2a1c);
      border-bottom: 2px solid #2b1710;
      text-shadow: 0 2px 0 rgba(0,0,0,0.45);
    }

    .stats {
      min-height: 94px;
      padding: 6px 16px 8px;
      font-size: 14px;
      line-height: 1.48;
      color: #4f4031;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(82,58,38,0.22);
      gap: 10px;
    }

    .stat-row b {
      color: #9b5d23;
    }

    .effects {
      min-height: 116px;
      padding: 8px 14px;
      font-size: 13px;
      line-height: 1.42;
    }

    .effects p {
      margin: 0 0 4px;
      color: #4f4031;
      font-weight: 700;
    }

    .effects .green { color: var(--green); }
    .effects .purple { color: var(--purple); }
    .effects .red { color: var(--red); }

    .inventory {
      padding: 7px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(99,62,39,0.95), rgba(46,29,22,0.95));
      border: 3px solid #1f1510;
      box-shadow: 0 5px 0 rgba(0,0,0,0.25);
    }

    .quick {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 7px;
    }

    .mini-btn {
      height: 28px;
      min-width: 72px;
      padding: 0 10px;
      border-radius: 9px;
      border: 2px solid #2b1b11;
      color: #3e2613;
      background: linear-gradient(#fff6d0, #dba44a);
      font-size: 14px;
      font-weight: 900;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.55);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .card {
      position: relative;
      height: 46px;
      border-radius: 10px;
      border: 3px solid #1f1510;
      background: linear-gradient(#fff4c9, #caa565);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.32);
    }

    .card::before {
      content: "";
      width: 36px;
      height: 30px;
      border-radius: 8px 8px 12px 12px;
      background: linear-gradient(#fff6aa 0 24%, #3679d7 25% 70%, #ffd748 71%);
      border: 2px solid #6b4520;
    }

    .badge {
      position: absolute;
      right: -6px;
      top: -8px;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #e94d4d;
      border: 2px solid #331915;
    }

    .bottombar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 70px;
      display: grid;
      grid-template-columns: 88px repeat(3, 1fr) 74px;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      background: linear-gradient(180deg, rgba(246,238,211,0.97), rgba(190,169,122,0.97));
      border-top: 4px solid #261a12;
    }

    .back {
      height: 46px;
      border: 3px solid #2b1b11;
      clip-path: polygon(0 50%, 25% 0, 100% 0, 100% 100%, 25% 100%);
      display: grid;
      place-items: center;
      padding-left: 14px;
      background: linear-gradient(#fffdf2, #d6c6f3);
      color: #4e3c5e;
      font-size: 16px;
      font-weight: 900;
    }

    .round {
      height: 48px;
      border-radius: 50%;
      border: 3px solid #2b1b11;
      background: linear-gradient(#fffdf4, #e8d6ff);
      color: #4e3c5e;
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 900;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.5), 0 4px 0 rgba(0,0,0,0.18);
    }

    .equip {
      height: 50px;
      border-radius: 50%;
      border: 3px solid #1e351f;
      background: linear-gradient(#72d38b, #2d9d55);
      color: white;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 900;
      text-shadow: 0 2px 0 rgba(0,0,0,0.3);
      box-shadow: 0 0 18px rgba(80, 211, 115, 0.55), inset 0 2px 0 rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <main class="screen" aria-label="骑士装备游戏界面示意">
    <header class="topbar">骑士装备 <span class="info">i</span></header>
    <section class="content">
      <aside class="tabs">
        <div class="tab">套装名字</div>
        <div class="tab active">最多四字</div>
        <div class="tab">套装名字</div>
        <div class="tab">最多四字</div>
        <div class="tab">套装名字</div>
        <div class="tab">最多四字</div>
        <div class="tab">套装名字</div>
        <div class="tab">最多四字</div>
      </aside>

      <section class="main">
        <div class="hero-area">
          <div class="slot filled s1"><div class="icon"><div class="armor"></div>99级</div></div>
          <div class="slot filled green s2"><div class="icon"><div class="armor"></div>99级</div></div>
          <div class="slot filled red s3"><div class="icon"><div class="armor"></div>99级</div></div>
          <div class="slot s4"></div>
          <div class="slot s5"></div>
          <div class="slot s6"></div>
          <div class="knight">
            <div class="cape"></div>
            <div class="helmet"></div>
            <div class="visor"></div>
            <div class="body"></div>
            <div class="pauldron left"></div>
            <div class="pauldron right"></div>
            <div class="guard"></div>
            <div class="sword"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">属性总览</div>
          <div class="stats">
            <div class="stat-row"><span>攻击加成</span><b>+12.8%</b></div>
            <div class="stat-row"><span>生命提升</span><b>+8600</b></div>
            <div class="stat-row"><span>护甲穿透</span><b>+340</b></div>
            <div class="stat-row"><span>暴击抗性</span><b>+9.5%</b></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">套装效果</div>
          <div class="effects">
            <p class="green">全套绿品：文案文案，提升骑士基础防御。</p>
            <p class="purple">全套紫品：文案文案文案，激活额外护盾效果。</p>
            <p class="red">全套红品：文案文案，冲锋后追加一次重击。</p>
            <p>收集指定套装可提升骑士战力与冒险收益。</p>
          </div>
        </div>

        <div class="inventory">
          <div class="quick">
            <button class="mini-btn">一键装备</button>
            <button class="mini-btn">一键升品</button>
          </div>
          <div class="cards">
            <div class="card"><span class="badge"></span></div>
            <div class="card"><span class="badge"></span></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
          </div>
        </div>
      </section>
    </section>

    <nav class="bottombar">
      <div class="back">返回</div>
      <div class="round">收藏</div>
      <div class="round">升品</div>
      <div class="round">强化</div>
      <div class="equip">装备</div>
    </nav>
  </main>
</body>
</html>
