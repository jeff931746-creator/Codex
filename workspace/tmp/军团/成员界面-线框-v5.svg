<svg xmlns="http://www.w3.org/2000/svg" width="430" height="820" viewBox="0 0 430 820">
  <defs>
    <style>
      .bg { fill: #f3ead8; }
      .page { fill: #efe1c8; stroke: #4d3526; stroke-width: 2; }
      .panel { fill: #ead6b6; stroke: #6b4a33; stroke-width: 2; }
      .soft { fill: #ddc29a; stroke: #7a5738; stroke-width: 1.5; }
      .dark { fill: #5a3a29; stroke: #2e1d15; stroke-width: 2; }
      .line { stroke: #6b4a33; stroke-width: 1.5; fill: none; }
      .btn { fill: #a94936; stroke: #4a1f17; stroke-width: 2; }
      .tab { fill: #ceb58f; stroke: #4d3526; stroke-width: 2; }
      .tab-on { fill: #f0ddba; stroke: #4d3526; stroke-width: 2; }
      .avatar { fill: #dec294; stroke: #4d3526; stroke-width: 2; }
      .tag { fill: #c87a36; stroke: #673b1e; stroke-width: 1.5; }
      .text {
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        fill: #3f2b1d;
        font-weight: 700;
        letter-spacing: 0;
      }
      .text-light {
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        fill: #fff4d7;
        font-weight: 700;
        letter-spacing: 0;
      }
      .small { font-size: 11px; }
      .mid { font-size: 13px; }
      .body { font-size: 14px; }
      .title { font-size: 18px; }
      .big { font-size: 20px; }
      .muted { fill: #7d6349; font-weight: 600; }
      .online { fill: #2d9b48; font-weight: 700; }
    </style>
  </defs>

  <rect width="430" height="820" class="bg"/>
  <rect x="12" y="12" width="406" height="796" rx="14" class="page"/>

  <!-- Top area -->
  <rect x="24" y="28" width="382" height="214" rx="8" class="soft"/>

