<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pocket Groove Frame Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050607;
      }

      video {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        background: #050607;
      }

      textarea {
        position: fixed;
        left: -10000px;
        top: -10000px;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <video id="video" muted playsinline preload="auto"></video>
    <textarea id="frameData" aria-hidden="true"></textarea>
    <script>
      const params = new URLSearchParams(window.location.search);
      const file = params.get("file") || "Pocket Groove Tactics Game Mobile Gameplay Android [EDhMQeeqfgo] 1080p60.mp4";
      const time = Number(params.get("t") || "0");
      const video = document.getElementById("video");
      const frameData = document.getElementById("frameData");
      function captureFrame() {
        window.setTimeout(() => {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext("2d");
            context.drawImage(video, 0, 0);
            frameData.value = canvas.toDataURL("image/jpeg", 0.92);
            document.body.dataset.ready = "1";
            document.body.dataset.currentTime = video.currentTime.toFixed(3);
            document.body.dataset.frameLen = String(frameData.value.length);
            document.body.dataset.error = "";
          } catch (error) {
            document.body.dataset.ready = "1";
            document.body.dataset.currentTime = video.currentTime.toFixed(3);
            document.body.dataset.error = error.message || String(error);
          }
        }, 200);
      }
      video.addEventListener("loadedmetadata", () => {
        video.currentTime = Math.min(Math.max(0, time), Math.max(0, video.duration - 0.1));
      });
      video.addEventListener("loadeddata", () => {
        if (time <= 0.05) captureFrame();
      });
      video.addEventListener("seeked", () => {
        video.pause();
        captureFrame();
      });
      video.src = file;
    </script>
  </body>
</html>
