<svg xmlns="http://www.w3.org/2000/svg" width="430" height="820" viewBox="0 0 430 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c4b2b"/>
      <stop offset="0.42" stop-color="#b68855"/>
      <stop offset="1" stop-color="#4b2d24"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c39a"/>
      <stop offset="1" stop-color="#b89a6e"/>
    </linearGradient>
    <linearGradient id="darkPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f261d" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#24140f" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="redBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9f4232"/>
      <stop offset="1" stop-color="#6f241d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2b160d" flood-opacity="0.45"/>
    </filter>
    <style>
      .title { font: 700 18px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffe6a8; }
      .text { font: 500 13px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #4b2c1a; }
      .light { font: 600 13px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fff1bd; }
      .muted { font: 500 12px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8a6d4a; }
      .small { font: 500 11px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6f5638; }
      .btn { font: 700 14px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fff1bd; }
      .tag { font: 700 10px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fff0bb; }
      .num { font: 700 13px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8b331d; }
    </style>
