<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1800" viewBox="0 0 2200 1800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="22%" r="88%"><stop offset="0" stop-color="#fff9ef"/><stop offset="0.55" stop-color="#f3e5cf"/><stop offset="1" stop-color="#dac09a"/></radialGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4d6"/><stop offset="0.55" stop-color="#f2d8a8"/><stop offset="1" stop-color="#d5ad73"/></linearGradient>
    <linearGradient id="inkPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e9"/><stop offset="1" stop-color="#ead2a9"/></linearGradient>
    <pattern id="grain" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M4 11H20M38 19H63M10 42H36M48 55H69" stroke="#a77a45" stroke-width="1" opacity="0.12"/>
      <circle cx="27" cy="59" r="1.6" fill="#8b653b" opacity="0.1"/>
      <circle cx="58" cy="33" r="1.3" fill="#8b653b" opacity="0.1"/>
    </pattern>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2bd56"/><stop offset="1" stop-color="#9f551e"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c99bea"/><stop offset="1" stop-color="#5b3472"/></linearGradient>
    <linearGradient id="locked" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#77736e"/><stop offset="1" stop-color="#474440"/></linearGradient>
    <linearGradient id="metalFrame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d422a"/><stop offset="0.45" stop-color="#261911"/><stop offset="1" stop-color="#100b08"/></linearGradient>
    <linearGradient id="bronzeInset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36e"/><stop offset="0.45" stop-color="#c47a2b"/><stop offset="1" stop-color="#7a3b17"/></linearGradient>
    <linearGradient id="purpleInset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e1b7ff"/><stop offset="0.45" stop-color="#925db0"/><stop offset="1" stop-color="#462657"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4e321b" flood-opacity="0.22"/></filter>
    <filter id="deepShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2a180b" flood-opacity="0.28"/></filter>
    <filter id="panelGlow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fff2bd" flood-opacity="0.55"/></filter>
    <filter id="goldGlow" x="-70%" y="-70%" width="240%" height="240%"><feDropShadow dx="0" dy="0" stdDeviation="11" flood-color="#ffd766" flood-opacity="0.92"/></filter>
    <filter id="purpleGlow" x="-70%" y="-70%" width="240%" height="240%"><feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#d9a8ff" flood-opacity="0.95"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#775333"/></marker>
    <symbol id="lockIcon" viewBox="0 0 40 48"><path d="M9 20V14C9 5 31 5 31 14V20" fill="none" stroke="#f1e8dc" stroke-width="5" stroke-linecap="round"/><rect x="4" y="19" width="32" height="26" rx="6" fill="#5f5b56" stroke="#b9b0a5" stroke-width="3"/><circle cx="20" cy="31" r="4" fill="#eee2d2"/><path d="M20 34V39" stroke="#eee2d2" stroke-width="3"/></symbol>
    <symbol id="totalAttrEntry" viewBox="0 0 140 46">
      <path d="M0 9L9 0H131L140 9V37L131 46H9L0 37Z" fill="url(#metalFrame)" stroke="#c99950" stroke-width="3"/>
      <rect x="13" y="24" width="7" height="11" rx="2" fill="#d7a64f"/><rect x="24" y="17" width="7" height="18" rx="2" fill="#e6bd68"/><rect x="35" y="10" width="7" height="25" rx="2" fill="#f5d687"/>
      <text x="86" y="30" text-anchor="middle" class="cn small white">总属性</text>
      <path d="M122 16L130 23L122 30" fill="none" stroke="#efcf8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <style>
      .cn{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:46px;font-weight:800;fill:#33200f}.sub{font-size:21px;fill:#70583f}.h{font-size:25px;font-weight:800;fill:#3d2919}.body{font-size:19px;fill:#634b35}.small{font-size:16px;fill:#745e49}.white{fill:#fff4dc}.muted{fill:#d8cec1}.edge{fill:none;stroke:#775333;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#7a8fa3;stroke-width:3;stroke-dasharray:10 8}.screenLabel{font-size:20px;font-weight:800;fill:#3d2919}.stageTitle{font-size:24px;font-weight:900;fill:#fff2d0}.stageSub{font-size:16px;fill:#f0d6a4}
    </style>
  </defs>

  <rect width="2200" height="1800" fill="url(#bg)"/>
  <rect width="2200" height="1800" fill="url(#grain)" opacity="0.58"/>
  <rect x="28" y="28" width="2144" height="1744" rx="26" fill="none" stroke="#b9935d" stroke-width="3"/>
  <path d="M56 36H2144L2164 56V1760L2144 1780H56L36 1760V56Z" fill="none" stroke="#fff4d5" stroke-width="2" opacity="0.72"/>
  <path d="M54 54H785L812 82L785 110H54Z" fill="url(#parchment)" stroke="#b98b4b" stroke-width="3" filter="url(#panelGlow)"/>
  <text x="70" y="88" class="cn title">军团科技：原 UE 内的低级 / 高级切换示意</text>
  <text x="70" y="132" class="cn sub">不改变现有环形科技树、顶部军团信息、底部科技详情和升级按钮；只补充层级标识与切换状态。</text>

  <!-- 状态 1 -->
  <g transform="translate(90 240)">
    <g transform="translate(0 -84)" filter="url(#deepShadow)">
      <path d="M0 8L10 0H470L480 8V48L470 56H10L0 48Z" fill="#3f2817" stroke="#c8954a" stroke-width="3"/>
      <text x="240" y="30" text-anchor="middle" class="cn stageTitle">状态 1：高级未开放</text>
      <text x="240" y="49" text-anchor="middle" class="cn stageSub">低级多层沿原环形链展示</text>
    </g>
    <rect x="-18" y="-18" width="516" height="1100" rx="24" fill="#d4b37b" stroke="#80552b" stroke-width="4" filter="url(#deepShadow)"/>
    <image href="ff-legion-technology-ui-reference.png" x="0" y="0" width="480" height="1038" preserveAspectRatio="xMidYMid meet"/>
    <use href="#totalAttrEntry" x="285" y="105" width="140" height="46" filter="url(#shadow)"/>

    <!-- 低级多层：沿现有科技链 -->
    <rect x="18" y="630" width="170" height="220" rx="28" fill="none" stroke="#8ba463" stroke-width="6" stroke-dasharray="12 8"/>
    <rect x="17" y="603" width="145" height="38" rx="18" fill="#647b43"/><text x="89" y="628" text-anchor="middle" class="cn small white">低级·第1层</text>
    <rect x="18" y="470" width="205" height="165" rx="28" fill="none" stroke="#e1a33e" stroke-width="7" filter="url(#goldGlow)"/>
    <rect x="17" y="443" width="160" height="38" rx="18" fill="#b87629"/><text x="97" y="468" text-anchor="middle" class="cn small white">低级·第2层</text>
    <rect x="65" y="315" width="205" height="155" rx="28" fill="none" stroke="#77736e" stroke-width="6" stroke-dasharray="12 8"/>
    <rect x="64" y="288" width="190" height="38" rx="18" fill="#56534f"/><text x="159" y="313" text-anchor="middle" class="cn small muted">低级·第3层（锁）</text>

    <!-- 底部详情框上沿的切换器 -->
    <g transform="translate(70 742)" filter="url(#shadow)">
      <path d="M0 12L12 0H328L340 12V52L328 64H12L0 52Z" fill="url(#metalFrame)" stroke="#d3a158" stroke-width="4"/>
      <path d="M9 16L20 7H155L168 20V44L155 57H20L9 48Z" fill="url(#bronzeInset)" stroke="#ffe4a3" stroke-width="3" filter="url(#goldGlow)"/>
      <path d="M172 20L185 7H320L331 16V48L320 57H185L172 44Z" fill="url(#locked)" stroke="#817b73" stroke-width="2"/>
      <polygon points="170,5 184,32 170,59 156,32" fill="#3d2819" stroke="#c9974f" stroke-width="3"/>
      <circle cx="10" cy="32" r="4" fill="#e0b66d"/><circle cx="330" cy="32" r="4" fill="#e0b66d"/>
      <text x="86" y="40" text-anchor="middle" class="cn small">低级科技</text>
      <use href="#lockIcon" x="190" y="16" width="23" height="28"/><text x="267" y="28" text-anchor="middle" class="cn small muted">高级科技</text><text x="267" y="47" text-anchor="middle" class="cn small muted">Lv.6 开放</text>
    </g>
    <circle cx="18" cy="18" r="25" fill="#a84f32" stroke="#f2c56e" stroke-width="3"/><text x="18" y="26" text-anchor="middle" class="cn h white">1</text>
    <rect y="1038" width="480" height="44" rx="8" fill="#f4e0b3" stroke="#94642f" stroke-width="3"/><text x="240" y="1067" text-anchor="middle" class="cn screenLabel">低级科技·高级未开放</text>
  </g>

  <!-- 状态 2 -->
  <g transform="translate(860 240)">
    <g transform="translate(0 -84)" filter="url(#deepShadow)">
      <path d="M0 8L10 0H470L480 8V48L470 56H10L0 48Z" fill="#4b2d16" stroke="#e0ad55" stroke-width="3"/>
      <text x="240" y="30" text-anchor="middle" class="cn stageTitle">状态 2：军团等级解锁</text>
      <text x="240" y="49" text-anchor="middle" class="cn stageSub">按钮发光 + 红点提示有新树</text>
    </g>
    <rect x="-18" y="-18" width="516" height="1100" rx="24" fill="#d4b37b" stroke="#80552b" stroke-width="4" filter="url(#deepShadow)"/>
    <image href="ff-legion-technology-ui-reference.png" x="0" y="0" width="480" height="1038" preserveAspectRatio="xMidYMid meet"/>
    <use href="#totalAttrEntry" x="285" y="105" width="140" height="46" filter="url(#shadow)"/>
    <g transform="translate(70 742)" filter="url(#shadow)">
      <path d="M0 12L12 0H328L340 12V52L328 64H12L0 52Z" fill="url(#metalFrame)" stroke="#d3a158" stroke-width="4"/>
      <path d="M9 16L20 7H155L168 20V44L155 57H20L9 48Z" fill="url(#bronzeInset)" stroke="#ffe4a3" stroke-width="3"/>
      <path d="M172 20L185 7H320L331 16V48L320 57H185L172 44Z" fill="#9b6b28" stroke="#ffdc67" stroke-width="4" filter="url(#goldGlow)"/>
      <polygon points="170,5 184,32 170,59 156,32" fill="#5a381b" stroke="#e4b65f" stroke-width="3"/>
      <circle cx="10" cy="32" r="4" fill="#e0b66d"/><circle cx="330" cy="32" r="4" fill="#e0b66d"/>
      <text x="86" y="40" text-anchor="middle" class="cn small">低级科技</text><text x="254" y="40" text-anchor="middle" class="cn small">高级科技</text>
      <circle cx="329" cy="3" r="17" fill="#d44e3f" stroke="#ffd272" stroke-width="3"/><text x="329" y="10" text-anchor="middle" class="cn h white">!</text>
    </g>
    <rect x="68" y="650" width="344" height="76" rx="16" fill="#e7f1db" stroke="#7c9856" stroke-width="3" filter="url(#goldGlow)"/><text x="240" y="680" text-anchor="middle" class="cn h">高级科技已开放</text><text x="240" y="708" text-anchor="middle" class="cn small">点击切换，查看新科技树</text>
    <circle cx="18" cy="18" r="25" fill="#a84f32" stroke="#f2c56e" stroke-width="3"/><text x="18" y="26" text-anchor="middle" class="cn h white">2</text>
    <rect y="1038" width="480" height="44" rx="8" fill="#f4e0b3" stroke="#94642f" stroke-width="3"/><text x="240" y="1067" text-anchor="middle" class="cn screenLabel">军团升级·高级切换已解锁</text>
  </g>

  <!-- 状态 3 -->
  <g transform="translate(1630 240)">
    <g transform="translate(0 -84)" filter="url(#deepShadow)">
      <path d="M0 8L10 0H470L480 8V48L470 56H10L0 48Z" fill="#3f254c" stroke="#d6a2ee" stroke-width="3"/>
      <text x="240" y="30" text-anchor="middle" class="cn stageTitle">状态 3：切到高级科技</text>
      <text x="240" y="49" text-anchor="middle" class="cn stageSub">同位置替换节点数据与视觉</text>
    </g>
    <rect x="-18" y="-18" width="516" height="1100" rx="24" fill="#9f7cb7" stroke="#59396d" stroke-width="4" filter="url(#deepShadow)"/>
    <image href="ff-legion-technology-ui-reference.png" x="0" y="0" width="480" height="1038" preserveAspectRatio="xMidYMid meet"/>
    <use href="#totalAttrEntry" x="285" y="105" width="140" height="46" filter="url(#shadow)"/>
    <!-- 仅替换科技树数据和视觉，原布局不动 -->
    <rect x="5" y="215" width="470" height="535" rx="30" fill="#24142f" opacity="0.42"/>
    <circle cx="240" cy="500" r="98" fill="none" stroke="#d3a3f3" stroke-width="8" filter="url(#purpleGlow)"/>
    <path d="M240 402L240 315M180 430L112 352M300 430L367 352M155 500L68 530M325 500L412 530M180 570L112 655M300 570L367 655" fill="none" stroke="#b77cd9" stroke-width="7" filter="url(#purpleGlow)"/>
    <circle cx="240" cy="315" r="35" fill="#553367" stroke="#d3a3f3" stroke-width="5"/>
    <circle cx="112" cy="352" r="35" fill="#553367" stroke="#d3a3f3" stroke-width="5"/>
    <circle cx="367" cy="352" r="35" fill="#553367" stroke="#d3a3f3" stroke-width="5"/>
    <circle cx="68" cy="530" r="35" fill="#3f3345" stroke="#75677d" stroke-width="5"/><use href="#lockIcon" x="54" y="513" width="28" height="34"/>
    <circle cx="412" cy="530" r="35" fill="#3f3345" stroke="#75677d" stroke-width="5"/><use href="#lockIcon" x="398" y="513" width="28" height="34"/>
    <circle cx="112" cy="655" r="35" fill="#553367" stroke="#d3a3f3" stroke-width="5"/>
    <circle cx="367" cy="655" r="35" fill="#553367" stroke="#d3a3f3" stroke-width="5"/>
    <rect x="90" y="236" width="300" height="54" rx="16" fill="#3e254c" stroke="#d1a4ee" stroke-width="3"/><text x="240" y="271" text-anchor="middle" class="cn h white">高级科技树</text>
    <g transform="translate(70 742)" filter="url(#shadow)">
      <path d="M0 12L12 0H328L340 12V52L328 64H12L0 52Z" fill="url(#metalFrame)" stroke="#a982ba" stroke-width="4"/>
      <path d="M9 16L20 7H155L168 20V44L155 57H20L9 48Z" fill="#66513e" stroke="#8e765e" stroke-width="2"/>
      <path d="M172 20L185 7H320L331 16V48L320 57H185L172 44Z" fill="url(#purpleInset)" stroke="#ebcaff" stroke-width="4" filter="url(#purpleGlow)"/>
      <polygon points="170,5 184,32 170,59 156,32" fill="#3e244a" stroke="#c99be4" stroke-width="3"/>
      <circle cx="10" cy="32" r="4" fill="#c99be4"/><circle cx="330" cy="32" r="4" fill="#c99be4"/>
      <text x="86" y="40" text-anchor="middle" class="cn small muted">低级科技</text><text x="254" y="40" text-anchor="middle" class="cn small white">高级科技</text>
    </g>
    <circle cx="18" cy="18" r="25" fill="#76518c" stroke="#e1c0f5" stroke-width="3"/><text x="18" y="26" text-anchor="middle" class="cn h white">3</text>
    <rect y="1038" width="480" height="44" rx="8" fill="#eee2f3" stroke="#79588e" stroke-width="3"/><text x="240" y="1067" text-anchor="middle" class="cn screenLabel">高级科技·沿用原环形布局</text>
  </g>

  <!-- 状态间交互 -->
  <path d="M595 725H815" class="edge"/><text x="705" y="695" text-anchor="middle" class="cn h">军团等级达到</text>
  <path d="M1365 725H1585" class="edge"/><text x="1475" y="675" text-anchor="middle" class="cn h">点击“高级科技”</text><text x="1475" y="705" text-anchor="middle" class="cn small">树盘同位交叉淡入</text>

  <!-- 总属性入口说明 -->
  <g transform="translate(590 265)" filter="url(#deepShadow)">
    <path d="M0 12L12 0H223L235 12V120L223 132H12L0 120Z" fill="url(#inkPanel)" stroke="#b8893f" stroke-width="3"/>
    <text x="118" y="38" text-anchor="middle" class="cn h">总属性入口</text>
    <text x="118" y="73" text-anchor="middle" class="cn small">点击打开属性汇总浮层</text>
    <text x="118" y="104" text-anchor="middle" class="cn small">合并低级+高级已生效加成</text>
  </g>
  <path d="M590 340H555L512 335" class="edge"/>

  <!-- 底部说明 -->
  <g transform="translate(90 1370)">
    <path d="M0 20L20 0H2000L2020 20V330L2000 350H20L0 330Z" fill="url(#inkPanel)" stroke="#8aa7bf" stroke-width="4" filter="url(#deepShadow)"/>
    <path d="M28 76H1992" stroke="#c9a46c" stroke-width="2" opacity="0.55"/>
    <text x="35" y="55" class="cn h">修正后的 UE 原则</text>
    <text x="45" y="108" class="cn body">1. 低级科技多层：沿现有环形科技链分段展开，不创建新页面或纵向树。</text>
    <text x="45" y="158" class="cn body">2. 低级 / 高级切换：紧贴底部科技详情框上沿，不占用原有顶部信息区。</text>
    <text x="45" y="208" class="cn body">3. 切换只替换科技树数据、节点纹样与连线色彩；屏幕布局、选中、详情和升级操作不变。</text>
    <text x="45" y="258" class="cn body">4. 高级节点前置未完成时，节点原位置锁定；点击可切回低级树并高亮所需节点。</text>
    <text x="45" y="308" class="cn body">5. 总属性入口始终位于军团信息区；汇总页不区分当前科技树，统一显示全部已生效加成。</text>
  </g>
</svg>
