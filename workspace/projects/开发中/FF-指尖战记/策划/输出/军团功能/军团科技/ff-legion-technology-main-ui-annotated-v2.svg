<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e6ecf2"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173b62"/>
      <stop offset="0.7" stop-color="#2f6f9f"/>
      <stop offset="1" stop-color="#e58a35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#18364f" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#39739e"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#dc812f"/>
    </marker>
    <style>
      .cn{font-family:"PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:42px;font-weight:800;fill:#fff}
      .subtitle{font-size:20px;fill:#dceaf5}
      .callTitle{font-size:24px;font-weight:800;fill:#173f61}
      .body{font-size:20px;fill:#40586b}
      .small{font-size:20px;fill:#586d7d}
      .white{fill:#fff}
      .card{fill:#fff;stroke:#91a9bb;stroke-width:2.5;filter:url(#shadow)}
      .cardBlue{fill:#eaf3fa;stroke:#4f83aa;stroke-width:2.5;filter:url(#shadow)}
      .cardOrange{fill:#fff0e2;stroke:#df8738;stroke-width:2.5;filter:url(#shadow)}
      .line{fill:none;stroke:#39739e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
      .lineOrange{fill:none;stroke:#dc812f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
      .num{font-size:24px;font-weight:800;fill:#fff}
    </style>
  </defs>

  <rect width="1800" height="1400" fill="url(#bg)"/>
  <rect x="20" y="20" width="1760" height="1360" rx="26" fill="none" stroke="#7893a8" stroke-width="2"/>
  <path d="M36 36H1764V108L1725 136H36Z" fill="url(#header)" filter="url(#shadow)"/>
  <text x="70" y="82" class="cn title">军团科技 · 主界面编号说明图</text>
  <text x="72" y="116" class="cn subtitle">正文可按 1—6 依次说明界面元素、科技节点状态和玩家可执行操作。</text>

  <!-- center UI reference -->
  <g filter="url(#shadow)">
    <rect x="641" y="165" width="518" height="1120" rx="18" fill="#172433" stroke="#335f7e" stroke-width="5"/>
    <image href="ff-legion-technology-ui-reference.png" x="650" y="174" width="500" height="1081" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- left callout 1 -->
  <g transform="translate(50 185)">
    <rect width="500" height="150" rx="20" class="cardBlue"/>
    <circle cx="42" cy="42" r="27" fill="#2f6f9f"/><text x="42" y="50" text-anchor="middle" class="cn num">1</text>
    <text x="82" y="48" class="cn callTitle">功能名称与帮助入口</text>
    <path d="M26 72H474" stroke="#bfd0dc" stroke-width="2"/>
    <text x="28" y="106" class="cn body">顶部显示“军团科技”功能名称</text>
    <text x="28" y="135" class="cn body">帮助入口用于查看规则说明</text>
  </g>
  <path d="M550 260H605V225H672" class="line"/>
  <circle cx="684" cy="225" r="22" fill="#2f6f9f" stroke="#fff" stroke-width="4"/><text x="684" y="233" text-anchor="middle" class="cn num">1</text>

  <!-- left callout 2 -->
  <g transform="translate(50 390)">
    <rect width="500" height="170" rx="20" class="card"/>
    <circle cx="42" cy="42" r="27" fill="#4f7896"/><text x="42" y="50" text-anchor="middle" class="cn num">2</text>
    <text x="82" y="48" class="cn callTitle">当前军团信息</text>
    <path d="M26 72H474" stroke="#c5d2dc" stroke-width="2"/>
    <text x="28" y="106" class="cn body">展示当前军团名称与军团等级</text>
    <text x="28" y="136" class="cn body">经验条显示当前经验与升级目标</text>
  </g>
  <path d="M550 475H610V360H688" class="line"/>
  <circle cx="700" cy="360" r="22" fill="#4f7896" stroke="#fff" stroke-width="4"/><text x="700" y="368" text-anchor="middle" class="cn num">2</text>

  <!-- left callout 3 -->
  <g transform="translate(50 675)">
    <rect width="500" height="190" rx="20" class="cardBlue"/>
    <circle cx="42" cy="42" r="27" fill="#2f6f9f"/><text x="42" y="50" text-anchor="middle" class="cn num">3</text>
    <text x="82" y="48" class="cn callTitle">科技树与节点连接</text>
    <path d="M26 72H474" stroke="#bfd0dc" stroke-width="2"/>
    <text x="28" y="106" class="cn body">科技节点沿连接关系排列</text>
    <text x="28" y="136" class="cn body">连接线帮助玩家查看前后节点关系</text>
    <text x="28" y="166" class="cn small">点击任意节点可查看对应详情</text>
  </g>
  <path d="M550 770H610V680H700" class="line"/>
  <circle cx="712" cy="680" r="22" fill="#2f6f9f" stroke="#fff" stroke-width="4"/><text x="712" y="688" text-anchor="middle" class="cn num">3</text>

  <!-- right callout 4 -->
  <g transform="translate(1250 245)">
    <rect width="500" height="220" rx="20" class="cardOrange"/>
    <circle cx="42" cy="42" r="27" fill="#df8435"/><text x="42" y="50" text-anchor="middle" class="cn num">4</text>
    <text x="82" y="48" class="cn callTitle">科技节点状态</text>
    <path d="M26 72H474" stroke="#e5c9ad" stroke-width="2"/>
    <text x="28" y="106" class="cn body">已完成：节点保持点亮</text>
    <text x="28" y="136" class="cn body">未完成：可点击查看要求和效果</text>
    <text x="28" y="166" class="cn body">可升级：满足当前升级条件</text>
    <text x="28" y="196" class="cn body">条件不足：显示当前缺少的条件</text>
  </g>
  <path d="M1250 355H1195V600H1125" class="lineOrange"/>
  <circle cx="1113" cy="600" r="22" fill="#df8435" stroke="#fff" stroke-width="4"/><text x="1113" y="608" text-anchor="middle" class="cn num">4</text>

  <!-- right callout 5 -->
  <g transform="translate(1250 720)">
    <rect width="500" height="190" rx="20" class="card"/>
    <circle cx="42" cy="42" r="27" fill="#4f7896"/><text x="42" y="50" text-anchor="middle" class="cn num">5</text>
    <text x="82" y="48" class="cn callTitle">当前选中节点详情</text>
    <path d="M26 72H474" stroke="#c5d2dc" stroke-width="2"/>
    <text x="28" y="106" class="cn body">展示节点名称和可获得的科技效果</text>
    <text x="28" y="136" class="cn body">同时显示当前节点的升级要求</text>
    <text x="28" y="166" class="cn small">切换节点后，详情区同步刷新</text>
  </g>
  <path d="M1250 815H1195V1075H1125" class="line"/>
  <circle cx="1113" cy="1075" r="22" fill="#4f7896" stroke="#fff" stroke-width="4"/><text x="1113" y="1083" text-anchor="middle" class="cn num">5</text>

  <!-- right callout 6 -->
  <g transform="translate(1250 1025)">
    <rect width="500" height="210" rx="20" class="cardOrange"/>
    <circle cx="42" cy="42" r="27" fill="#df8435"/><text x="42" y="50" text-anchor="middle" class="cn num">6</text>
    <text x="82" y="48" class="cn callTitle">科技升级材料与“升级”按钮</text>
    <path d="M26 72H474" stroke="#e5c9ad" stroke-width="2"/>
    <text x="28" y="106" class="cn body">显示玩家当前持有的科技升级材料</text>
    <text x="28" y="136" class="cn body">材料名称待定</text>
    <text x="28" y="166" class="cn body">满足条件时，“升级”按钮可点击</text>
    <text x="28" y="196" class="cn small">条件不足时，按钮不可点击并显示原因</text>
  </g>
  <path d="M1250 1130H1198V1205H1125" class="lineOrange"/>
  <circle cx="1113" cy="1205" r="22" fill="#df8435" stroke="#fff" stroke-width="4"/><text x="1113" y="1213" text-anchor="middle" class="cn num">6</text>

  <!-- footnote -->
  <g transform="translate(250 1322)">
    <rect width="1300" height="48" rx="18" fill="#173f65"/>
    <text x="650" y="32" text-anchor="middle" class="cn small white">界面底图为结构参考，最终名称与数值以配置为准。</text>
  </g>
</svg>
