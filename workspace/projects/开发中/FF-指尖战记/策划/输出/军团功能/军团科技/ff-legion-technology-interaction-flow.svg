<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2700" viewBox="0 0 1800 2700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf5eb"/><stop offset="1" stop-color="#eee0ca"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8dd"/><stop offset="1" stop-color="#ead0a2"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#50321f"/><stop offset="1" stop-color="#21130c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#63411f" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#735033"/>
    </marker>
    <style>
      .cn{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:42px;font-weight:800;fill:#382516}.sub{font-size:20px;fill:#755a40}.h{font-size:23px;font-weight:800;fill:#3d2919}.body{font-size:18px;fill:#624830}.small{font-size:16px;fill:#745d47}.white{fill:#fff1c5}.node{fill:url(#page);stroke:#876039;stroke-width:3;filter:url(#shadow)}.decision{fill:#fff5d1;stroke:#aa7b2a;stroke-width:3;filter:url(#shadow)}.success{fill:#e3f0d7;stroke:#718d4c;stroke-width:3;filter:url(#shadow)}.warn{fill:#f7dfd6;stroke:#a75e48;stroke-width:3;filter:url(#shadow)}.info{fill:#eaf1f7;stroke:#6b8aa6;stroke-width:3;filter:url(#shadow)}.level-lock{fill:#e7e2da;stroke:#7e756b;stroke-width:3;filter:url(#shadow)}.pre-lock{fill:#eee7f5;stroke:#80699a;stroke-width:3;filter:url(#shadow)}.dark{fill:url(#dark);stroke:#d6a149;stroke-width:3;filter:url(#shadow)}.edge{fill:none;stroke:#735033;stroke-width:4;marker-end:url(#arrow)}.edge2{fill:none;stroke:#96734d;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#96734d;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow)}.label{font-size:17px;font-weight:800;fill:#714a27}
    </style>
  </defs>

  <rect width="1800" height="2700" fill="url(#bg)"/>
  <rect x="34" y="30" width="1732" height="2640" rx="22" fill="none" stroke="#b89561" stroke-width="3"/>
  <text x="70" y="92" class="cn title">军团科技完整交互流程图</text>
  <text x="70" y="132" class="cn sub">从军团科技页开始；不包含军团入口及入团资格判断。</text>

  <g transform="translate(70 160)">
    <rect width="1660" height="105" rx="15" fill="#edf2f7" stroke="#7188a0" stroke-width="2"/>
    <text x="28" y="36" class="cn h">核心关系</text>
    <text x="28" y="72" class="cn body">军团等级 → 决定可学习科技层级　　■ 军团等级资格锁 → 军团升级后解除　　◆ 前置科技锁 → 学完指定低级科技后解除</text>
  </g>

  <!-- 科技页与新层级感知 -->
  <g transform="translate(650 315)"><rect width="500" height="95" rx="18" class="dark"/><text x="250" y="39" text-anchor="middle" class="cn h white">进入军团科技页</text><text x="250" y="70" text-anchor="middle" class="cn body white">读取当前军团等级与个人科技状态</text></g>
  <path d="M900 410V455" class="edge"/>
  <g transform="translate(610 455)"><rect width="580" height="145" rx="16" class="node"/><text x="290" y="38" text-anchor="middle" class="cn h">科技树默认状态</text><text x="30" y="79" class="cn body">展示当前军团等级及可开放的科技层级</text><text x="30" y="112" class="cn body">显示低级 → 高级科技依赖连线</text></g>
  <path d="M900 600V650" class="edge"/>
  <polygon points="900,645 1090,735 900,825 710,735" class="decision"/>
  <text x="900" y="723" text-anchor="middle" class="cn h">是否有军团升级后</text><text x="900" y="757" text-anchor="middle" class="cn h">新获得资格的科技层级？</text>

  <path d="M1090 735H1180" class="edge"/><text x="1125" y="710" class="cn label">有新层级</text>
  <g transform="translate(1180 610)"><rect width="520" height="105" rx="15" class="success"/><text x="260" y="39" text-anchor="middle" class="cn h">1. 军团升级反馈</text><text x="260" y="73" text-anchor="middle" class="cn body">提示获得新科技层级资格</text></g>
  <path d="M1440 715V760" class="edge2"/>
  <g transform="translate(1180 760)"><rect width="520" height="105" rx="15" class="success"/><text x="260" y="39" text-anchor="middle" class="cn h">2. 科技入口待查看提示</text><text x="260" y="73" text-anchor="middle" class="cn body">在新层级未查看前保留提示标记</text></g>
  <path d="M1440 865V910" class="edge2"/>
  <g transform="translate(1180 910)"><rect width="520" height="125" rx="15" class="success"/><text x="260" y="39" text-anchor="middle" class="cn h">3. 进入后定位新层级</text><text x="260" y="76" text-anchor="middle" class="cn body">解除军团等级资格锁</text><text x="260" y="104" text-anchor="middle" class="cn small">前置未完成时，节点切换为前置科技锁</text></g>

  <path d="M900 825V1045" class="edge"/><text x="920" y="875" class="cn label">无新层级</text>
  <path d="M1180 972H1080V1090H1040" class="edge2"/><text x="1060" y="945" class="cn label">定位完成</text>

  <!-- 节点状态判断 -->
  <g transform="translate(650 1045)"><rect width="500" height="100" rx="16" class="node"/><text x="250" y="39" text-anchor="middle" class="cn h">玩家点击科技节点</text><text x="250" y="72" text-anchor="middle" class="cn body">不可学习节点仍可查看详情和解锁路径</text></g>
  <path d="M900 1145V1190" class="edge"/>
  <polygon points="900,1185 1065,1265 900,1345 735,1265" class="decision"/>
  <text x="900" y="1274" text-anchor="middle" class="cn h">节点是否已学习？</text>

  <path d="M735 1265H575" class="edge2"/><text x="635" y="1238" class="cn label">已学习</text>
  <g transform="translate(85 1165)"><rect width="490" height="170" rx="16" class="success"/><text x="245" y="40" text-anchor="middle" class="cn h">已学科技</text><text x="28" y="82" class="cn body">节点保持点亮，展示已生效收益</text><text x="28" y="118" class="cn body">换入低等级军团后，已学收益保留</text><text x="28" y="148" class="cn small">仅限制后续科技学习</text></g>

  <path d="M900 1345V1395" class="edge"/><text x="920" y="1378" class="cn label">未学习</text>
  <polygon points="900,1390 1095,1485 900,1580 705,1485" class="decision"/>
  <text x="900" y="1470" text-anchor="middle" class="cn h">当前军团等级</text><text x="900" y="1505" text-anchor="middle" class="cn h">是否具备该科技层级资格？</text>

  <path d="M705 1485H585" class="edge2"/><text x="590" y="1458" class="cn label">等级不足</text>
  <g transform="translate(70 1410)"><rect width="515" height="190" rx="16" class="level-lock"/><text x="257" y="42" text-anchor="middle" class="cn h">■ 军团等级资格锁</text><text x="28" y="85" class="cn body">低级/高级科技节点灰态</text><text x="28" y="122" class="cn body">展示当前军团等级与目标层级要求</text><text x="28" y="159" class="cn body">提示：「提升军团等级后开放」</text></g>

  <path d="M900 1580V1630" class="edge"/><text x="920" y="1613" class="cn label">等级已满足</text>
  <polygon points="900,1625 1095,1720 900,1815 705,1720" class="decision"/>
  <text x="900" y="1705" text-anchor="middle" class="cn h">指定低级/前置科技</text><text x="900" y="1740" text-anchor="middle" class="cn h">是否全部完成？</text>

  <path d="M1095 1720H1140" class="edge2"/><text x="1110" y="1693" class="cn label">未完成</text>
  <g transform="translate(1140 1605)"><rect width="590" height="220" rx="16" class="pre-lock"/><text x="295" y="42" text-anchor="middle" class="cn h">◆ 前置科技锁</text><text x="28" y="84" class="cn body">高级科技节点灰态</text><text x="28" y="121" class="cn body">依赖连线指向未完成的低级科技</text><text x="28" y="158" class="cn body">提示：「完成指定低级科技后可学习」</text><text x="28" y="194" class="cn small">军团升级只解除等级锁，不自动学习高级科技</text></g>

  <path d="M900 1815V1865" class="edge"/><text x="920" y="1848" class="cn label">前置全部完成</text>
  <polygon points="900,1860 1065,1940 900,2020 735,1940" class="decision"/>
  <text x="900" y="1929" text-anchor="middle" class="cn h">其他既有学习条件</text><text x="900" y="1962" text-anchor="middle" class="cn h">是否满足？</text>

  <path d="M735 1940H580" class="edge2"/><text x="600" y="1914" class="cn label">条件不足</text>
  <g transform="translate(120 1875)"><rect width="460" height="140" rx="16" class="warn"/><text x="230" y="40" text-anchor="middle" class="cn h">不可学习</text><text x="28" y="82" class="cn body">详情区展示具体不足项</text><text x="28" y="116" class="cn small">科技状态不变</text></g>

  <!-- 学习与结果 -->
  <path d="M900 2020V2065" class="edge"/><text x="920" y="2050" class="cn label">全部条件满足</text>
  <g transform="translate(690 2065)"><rect width="420" height="115" rx="16" class="success"/><text x="210" y="40" text-anchor="middle" class="cn h">节点可学习</text><text x="210" y="78" text-anchor="middle" class="cn body">高亮节点与前置连线</text><text x="210" y="103" text-anchor="middle" class="cn small">点击「学习」</text></g>
  <path d="M900 2180V2225" class="edge"/>
  <polygon points="900,2220 1080,2305 900,2390 720,2305" class="decision"/>
  <text x="900" y="2294" text-anchor="middle" class="cn h">学习时再次判断</text><text x="900" y="2328" text-anchor="middle" class="cn h">全部条件是否成立？</text>

  <path d="M720 2305H580" class="edge2"/><text x="590" y="2278" class="cn label">失败</text>
  <g transform="translate(90 2225)"><rect width="490" height="165" rx="16" class="warn"/><text x="245" y="40" text-anchor="middle" class="cn h">学习失败</text><text x="28" y="82" class="cn body">分别提示：等级不足 / 前置未完成 /</text><text x="28" y="115" class="cn body">其他学习条件不足</text><text x="28" y="145" class="cn small">不改变科技状态，刷新节点与详情</text></g>

  <path d="M900 2390V2435" class="edge"/><text x="920" y="2422" class="cn label">成功</text>
  <g transform="translate(690 2435)"><rect width="420" height="150" rx="16" class="success"/><text x="210" y="40" text-anchor="middle" class="cn h">学习成功</text><text x="210" y="80" text-anchor="middle" class="cn body">节点点亮，科技收益生效</text><text x="210" y="116" text-anchor="middle" class="cn body">重新计算后续科技状态</text></g>
  <path d="M1110 2510H1160" class="edge"/>
  <g transform="translate(1160 2395)"><rect width="570" height="190" rx="16" class="info"/><text x="285" y="40" text-anchor="middle" class="cn h">后续高级科技刷新</text><text x="28" y="82" class="cn body">低级科技全部完成：解除前置科技锁</text><text x="28" y="119" class="cn body">军团等级已满足：刷新为可学习/条件不足</text><text x="28" y="156" class="cn body">军团等级不足：继续保持等级资格锁</text></g>

  <text x="70" y="2635" class="cn small">表现要求：双条件同时不满足时，详情分别展示“军团等级不足”与“前置科技未完成”，不合并为笼统的“未解锁”。</text>
</svg>
