<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1500" viewBox="0 0 980 1500">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff9ed"/><stop offset="1" stop-color="#e5c896"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#51331f"/><stop offset="1" stop-color="#17100d"/></linearGradient>
    <linearGradient id="treeBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b211f"/><stop offset="0.5" stop-color="#17130f"/><stop offset="1" stop-color="#24170f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe49a"/><stop offset="0.45" stop-color="#d39a3e"/><stop offset="1" stop-color="#87501e"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#865b8d"/><stop offset="1" stop-color="#3d273f"/></linearGradient>
    <linearGradient id="mask" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#101516" stop-opacity="0.94"/><stop offset="0.65" stop-color="#22282b" stop-opacity="0.91"/><stop offset="1" stop-color="#3b4246" stop-opacity="0.84"/></linearGradient>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M4 9H20M28 17H45M8 33H27M34 42H47" stroke="#b68a55" stroke-width="1" opacity="0.1"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#28170b" flood-opacity="0.38"/></filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feDropShadow dx="0" dy="0" stdDeviation="11" flood-color="#ffd16b" flood-opacity="0.85"/></filter>
    <style>
      .cn{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:36px;font-weight:900;fill:#332216}.sub{font-size:18px;fill:#70543a}.uiTitle{font-size:28px;font-weight:900;fill:#fff1ce}.h{font-size:21px;font-weight:800;fill:#3d291b}.body{font-size:17px;fill:#5e4631}.small{font-size:15px;fill:#6d5945}.tiny{font-size:13px;fill:#75624d}.white{fill:#fff6df}.muted{fill:#bcb7af}
    </style>
  </defs>

  <rect width="980" height="1500" fill="url(#page)"/><rect width="980" height="1500" fill="url(#grain)"/>
  <rect x="22" y="22" width="936" height="1456" rx="26" fill="none" stroke="#a9793d" stroke-width="3"/>
  <text x="490" y="70" text-anchor="middle" class="cn title">军团科技 · 线形科技树最简版</text>
  <text x="490" y="106" text-anchor="middle" class="cn sub">低级科技持续向上延伸 · 军团未开放区域使用遮罩</text>

  <g transform="translate(190 145)" filter="url(#shadow)">
    <rect x="-14" y="-14" width="628" height="1314" rx="26" fill="#c39353" stroke="#67401d" stroke-width="5"/>
    <image href="ff-legion-technology-ui-reference.png" x="0" y="0" width="600" height="1286" preserveAspectRatio="xMidYMid meet"/>
    <rect x="0" y="0" width="600" height="1286" fill="none" stroke="#f4d48e" stroke-width="3"/>

    <!-- 顶部：删除军团信息、P/G对比和领先说明，只保留页面名与总属性 -->
    <path d="M22 88L34 76H566L578 88V188L566 200H34L22 188Z" fill="url(#dark)" stroke="#8f6537" stroke-width="3"/>
    <text x="55" y="132" class="cn uiTitle">低级科技</text>
    <text x="55" y="163" class="cn tiny white" opacity="0.72">向上拖动查看更高科技</text>
    <g transform="translate(410 112)">
      <path d="M0 8L8 0H143L151 8V38L143 46H8L0 38Z" fill="#231914" stroke="#d3a052" stroke-width="3"/>
      <rect x="15" y="24" width="6" height="10" fill="#d7a64f"/><rect x="25" y="18" width="6" height="16" fill="#e6bd68"/><rect x="35" y="11" width="6" height="23" fill="#f4d486"/>
      <text x="98" y="30" text-anchor="middle" class="cn small white">总属性 ›</text>
    </g>

    <!-- 重新绘制线形科技地图 -->
    <path d="M24 214H576V858L564 870H36L24 858Z" fill="url(#treeBg)" stroke="#6e4d2e" stroke-width="3"/>
    <path d="M42 230H558M42 845H558" stroke="#8c673e" stroke-width="2" opacity="0.45"/>
    <path d="M300 810V245" stroke="#6f512f" stroke-width="16" stroke-linecap="round"/>
    <path d="M300 810V414" stroke="#d49a42" stroke-width="7" stroke-linecap="round"/>
    <path d="M300 414V245" stroke="#596166" stroke-width="7" stroke-dasharray="10 12" stroke-linecap="round"/>

    <!-- 已完成节点 -->
    <g transform="translate(300 775)" filter="url(#shadow)">
      <circle r="43" fill="#442816" stroke="#d5953b" stroke-width="5"/>
      <path d="M-18 2L-4 16L22-17" fill="none" stroke="#ffe08a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="58" y="-28" width="185" height="56" rx="14" fill="#302219" stroke="#8f6637" stroke-width="2"/>
      <text x="76" y="-5" class="cn small white">军团生命训练 I</text><text x="76" y="18" class="cn tiny" fill="#9bc87a">已完成 · 3/3</text>
    </g>
    <g transform="translate(300 650)" filter="url(#shadow)">
      <circle r="43" fill="#442816" stroke="#d5953b" stroke-width="5"/>
      <path d="M-18 2L-4 16L22-17" fill="none" stroke="#ffe08a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-243" y="-28" width="185" height="56" rx="14" fill="#302219" stroke="#8f6637" stroke-width="2"/>
      <text x="-225" y="-5" class="cn small white">军团攻击训练 II</text><text x="-225" y="18" class="cn tiny" fill="#9bc87a">已完成 · 3/3</text>
    </g>

    <!-- 当前选中节点 -->
    <g transform="translate(300 515)" filter="url(#glow)">
      <circle r="58" fill="url(#gold)" stroke="#ffe8a7" stroke-width="6"/>
      <circle r="43" fill="#342117" stroke="#e6b65d" stroke-width="3"/>
      <path d="M-18 19L0-23L18 19M-11 4H11" fill="none" stroke="#f6d177" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-42" y="45" width="84" height="30" rx="15" fill="#d18a2d" stroke="#ffe59d" stroke-width="2"/>
      <text x="0" y="66" text-anchor="middle" class="cn tiny white">2 / 3</text>
      <rect x="74" y="-34" width="220" height="68" rx="15" fill="#4b2d19" stroke="#e0a84b" stroke-width="3"/>
      <text x="94" y="-7" class="cn small white">军团攻击训练 III</text><text x="94" y="19" class="cn tiny" fill="#ffd985">当前选中节点</text>
    </g>

    <!-- 军团开放边界 -->
    <g>
      <rect x="24" y="214" width="552" height="205" fill="url(#mask)"/>
      <path d="M36 408H564" stroke="#f0b64f" stroke-width="4" stroke-dasharray="11 7"/>
      <path d="M42 397L58 408L42 419M558 397L542 408L558 419" fill="#f0b64f"/>
      <rect x="154" y="384" width="292" height="48" rx="20" fill="#35251b" stroke="#f0b64f" stroke-width="3"/>
      <text x="300" y="414" text-anchor="middle" class="cn small white">当前军团科技开放至此</text>
      <g transform="translate(300 315)">
        <circle r="35" fill="#22282a" stroke="#7d8589" stroke-width="4"/>
        <rect x="-14" y="-4" width="28" height="24" rx="4" fill="#7d8589"/><path d="M-9-4V-12A9 9 0 0 1 9-12V-4" fill="none" stroke="#aeb5b8" stroke-width="5"/>
        <text x="55" y="6" class="cn small muted">军团生命训练 IV</text>
      </g>
      <g transform="translate(300 245)" opacity="0.72">
        <circle r="28" fill="#22282a" stroke="#697175" stroke-width="4"/>
        <rect x="-11" y="-3" width="22" height="19" rx="3" fill="#70787c"/><path d="M-7-3V-10A7 7 0 0 1 7-10V-3" fill="none" stroke="#939a9d" stroke-width="4"/>
      </g>
    </g>

    <!-- 低级/高级切换 -->
    <g transform="translate(78 885)" filter="url(#shadow)">
      <path d="M0 12L12 0H432L444 12V60L432 72H12L0 60Z" fill="url(#dark)" stroke="#d1a158" stroke-width="4"/>
      <path d="M9 17L22 8H200L217 24V48L200 64H22L9 55Z" fill="url(#gold)" stroke="#ffe3a2" stroke-width="3"/>
      <path d="M225 24L242 8H422L435 17V55L422 64H242L225 48Z" fill="url(#purple)" stroke="#a47bad" stroke-width="3"/>
      <text x="111" y="45" text-anchor="middle" class="cn h">低级科技</text>
      <text x="333" y="45" text-anchor="middle" class="cn h white">高级科技</text>
    </g>

    <!-- 当前节点详情 -->
    <g transform="translate(38 978)" filter="url(#shadow)">
      <path d="M0 15L15 0H509L524 15V214L509 229H15L0 214Z" fill="#b88b59" stroke="#4c2e18" stroke-width="5"/>
      <circle cx="75" cy="75" r="52" fill="#352117" stroke="#e0a64b" stroke-width="5"/>
      <path d="M55 94L75 48L95 94M62 76H88" fill="none" stroke="#e9bd66" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="148" y="42" class="cn h">军团攻击训练 III</text>
      <text x="148" y="74" class="cn small">当前节点增加</text>
      <text x="148" y="111" class="cn h" fill="#2f6d2d">全体攻击 +5%</text>
      <text x="148" y="143" class="cn tiny">当前等级 2/3 · 升级后增加本节点属性</text>
      <path d="M24 165H500" stroke="#765333" stroke-width="2" opacity="0.55"/>
      <text x="32" y="202" class="cn small">消耗科技点：1</text>
      <g transform="translate(352 174)"><path d="M0 8L8 0H132L140 8V43L132 51H8L0 43Z" fill="url(#gold)" stroke="#684019" stroke-width="3"/><text x="70" y="34" text-anchor="middle" class="cn h">升级科技</text></g>
    </g>
  </g>

  <g transform="translate(132 1456)"><rect width="716" height="28" rx="14" fill="#4a2d18"/><text x="358" y="20" text-anchor="middle" class="cn tiny white">最简交互：上下拖动科技链 → 点击节点 → 查看本节点增加属性 → 升级</text></g>
</svg>
