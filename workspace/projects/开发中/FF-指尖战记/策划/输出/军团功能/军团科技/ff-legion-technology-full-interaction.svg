  <!-- 6 总属性 -->
  <g transform="translate(1585 205)" filter="url(#shadow)">
    <path d="M0 18L18 0H1130L1148 18V300L1130 318H18L0 300Z" fill="url(#paper)" stroke="#967143" stroke-width="4"/>
    <circle cx="44" cy="45" r="27" fill="#9d7835"/><text x="44" y="53" text-anchor="middle" class="cn num">6</text><text x="84" y="53" class="cn pt">查看总属性</text><path d="M28 78H1120" stroke="#c49a63" stroke-width="2"/>
    <text x="34" y="116" class="cn body">点击顶部“总属性”打开汇总浮层；不受当前低级/高级页签影响。</text>
    <g transform="translate(34 150)"><rect width="300" height="96" rx="17" fill="#fff0d0" stroke="#c57e28" stroke-width="3"/><text x="150" y="38" text-anchor="middle" class="cn h">低级科技已生效</text><text x="150" y="71" text-anchor="middle" class="cn body">按属性类型汇总</text></g>
    <text x="365" y="211" text-anchor="middle" class="cn title">+</text>
    <g transform="translate(400 150)"><rect width="300" height="96" rx="17" fill="#eee0f5" stroke="#8653a0" stroke-width="3"/><text x="150" y="38" text-anchor="middle" class="cn h">高级科技已生效</text><text x="150" y="71" text-anchor="middle" class="cn body">按属性类型汇总</text></g>
    <text x="732" y="211" text-anchor="middle" class="cn title">=</text>
