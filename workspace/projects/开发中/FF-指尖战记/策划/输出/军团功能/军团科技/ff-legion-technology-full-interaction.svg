    <g transform="translate(34 108)"><rect width="505" height="88" rx="16" fill="#e4f0d9" stroke="#70944d" stroke-width="3"/><text x="24" y="33" class="cn h">已学习 / 已满级</text><text x="24" y="64" class="cn small">节点点亮；收益保留；满级时升级按钮置灰</text></g>
    <g transform="translate(34 211)"><rect width="505" height="88" rx="16" fill="#fff1d1" stroke="#d49130" stroke-width="3" filter="url(#glow)"/><text x="24" y="33" class="cn h">可升级</text><text x="24" y="64" class="cn small">军团等级、前置科技、科技点均满足</text></g>
    <g transform="translate(34 314)"><rect width="505" height="88" rx="16" fill="#dedad5" stroke="#77736f" stroke-width="3"/><use href="#lock" x="22" y="19" width="34" height="41"/><text x="72" y="33" class="cn h">军团等级资格锁</text><text x="72" y="64" class="cn small">显示当前等级与目标层级要求</text></g>
    <g transform="translate(34 417)"><rect width="505" height="88" rx="16" fill="#eadff0" stroke="#8653a0" stroke-width="3"/><use href="#lock" x="22" y="19" width="34" height="41"/><text x="72" y="33" class="cn h">前置科技锁</text><text x="72" y="64" class="cn small">高亮未完成前置；可切回对应低级节点</text></g>
    <text x="286" y="548" text-anchor="middle" class="cn small">两类条件均不满足时，分别显示，不合并为“未解锁”</text>
