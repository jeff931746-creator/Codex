    <g transform="translate(52 112)"><rect width="260" height="82" rx="17" fill="url(#gold)" stroke="#ffe09a" stroke-width="4" filter="url(#glow)"/><text x="130" y="50" text-anchor="middle" class="cn h white">点击「升级科技」</text></g>
