  <!-- 完整主循环 -->
  <g transform="translate(70 1930)" filter="url(#shadow)">
    <path d="M0 18L18 0H2662L2680 18V170L2662 188H18L0 170Z" fill="url(#dark)" stroke="#c69548" stroke-width="4"/>
