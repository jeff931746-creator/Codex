<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="2200" viewBox="0 0 2800 2200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff9ed"/><stop offset=".62" stop-color="#f1dfc3"/><stop offset="1" stop-color="#d5b586"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff8e8"/><stop offset="1" stop-color="#e8cc9b"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#684526"/><stop offset=".5" stop-color="#281910"/><stop offset="1" stop-color="#100a07"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd97c"/><stop offset=".5" stop-color="#c67a27"/><stop offset="1" stop-color="#6f3513"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5bdff"/><stop offset=".5" stop-color="#9460b1"/><stop offset="1" stop-color="#432551"/></linearGradient>
    <pattern id="grain" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M5 12H27M40 22H65M9 48H37M47 60H68" stroke="#8a643a" opacity=".1"/><circle cx="30" cy="62" r="1.5" fill="#8a643a" opacity=".1"/></pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#311b0c" flood-opacity=".25"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#ffd15d" flood-opacity=".9"/></filter>
    <filter id="pglow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#d6a0f5" flood-opacity=".9"/></filter>
