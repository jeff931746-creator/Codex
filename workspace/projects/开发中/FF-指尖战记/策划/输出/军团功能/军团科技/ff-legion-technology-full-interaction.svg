    <style>
      .cn{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:48px;font-weight:900;fill:#302014}.sub{font-size:21px;fill:#6e563f}.pt{font-size:25px;font-weight:900;fill:#3a281a}.h{font-size:20px;font-weight:800;fill:#3b291b}.body{font-size:17px;fill:#5f4935}.small{font-size:14px;fill:#6f5944}.white{fill:#fff4dc}.muted{fill:#d9d0c4}.edge{fill:none;stroke:#865523;stroke-width:4;marker-end:url(#arrow)}.pedge{fill:none;stroke:#75428d;stroke-width:4;marker-end:url(#parrow)}.dash{stroke-dasharray:10 8}.num{font-size:21px;font-weight:900;fill:#fff7e4}
    </style>
  </defs>

  <rect width="2800" height="2200" fill="url(#bg)"/><rect width="2800" height="2200" fill="url(#grain)" opacity=".7"/>
  <rect x="28" y="28" width="2744" height="2144" rx="28" fill="none" stroke="#aa7d46" stroke-width="3"/>
  <path d="M52 42H2748L2760 54V2146L2748 2158H52L40 2146V54Z" fill="none" stroke="#fff4d8" stroke-width="2"/>
  <path d="M60 58H1030L1060 88L1030 118H60Z" fill="url(#paper)" stroke="#b68240" stroke-width="3" filter="url(#shadow)"/>
  <text x="80" y="96" class="cn title">军团科技 · 完整 UE 交互图</text>
  <text x="80" y="145" class="cn sub">从进入页面到浏览、选中、判定、升级、属性生效与退出；所有操作均发生在原军团科技 UE 内。</text>

  <!-- 1 进入与默认状态 -->
  <g transform="translate(70 205)" filter="url(#shadow)">
    <path d="M0 18L18 0H675L693 18V280L675 298H18L0 280Z" fill="url(#paper)" stroke="#9c6a30" stroke-width="4"/>
    <circle cx="44" cy="45" r="27" fill="#a85b2a"/><text x="44" y="53" text-anchor="middle" class="cn num">1</text>
    <text x="84" y="53" class="cn pt">进入页面与默认定位</text><path d="M28 78H665" stroke="#c49a63" stroke-width="2"/>
    <text x="34" y="116" class="cn body">读取：军团等级、可用科技点、个人已学科技、上次浏览位置。</text>
    <text x="34" y="153" class="cn body">首次进入：默认显示低级科技与当前可学习层段。</text>
    <text x="34" y="190" class="cn body">再次进入：恢复低级/高级页签及各自上次浏览位置。</text>
    <g transform="translate(34 218)"><rect width="625" height="48" rx="13" fill="#eaf2de" stroke="#7e9b58" stroke-width="3"/><text x="312" y="31" text-anchor="middle" class="cn body">若军团升级产生新层级：入口红点 → 进入后定位新层级</text></g>
  </g>

  <!-- 2 浏览与切换 -->
  <g transform="translate(70 550)" filter="url(#shadow)">
    <path d="M0 18L18 0H675L693 18V630L675 648H18L0 630Z" fill="url(#paper)" stroke="#a46c28" stroke-width="4"/>
    <circle cx="44" cy="45" r="27" fill="#bd7827"/><text x="44" y="53" text-anchor="middle" class="cn num">2</text>
    <text x="84" y="53" class="cn pt">浏览科技树与低 / 高级切换</text><path d="M28 78H665" stroke="#c49a63" stroke-width="2"/>
    <text x="34" y="115" class="cn body">拖动/浏览原环形科技链；低级多层沿环形分段展开。</text>
    <text x="34" y="148" class="cn small">高级未开放时页签锁定；军团等级达到后解锁，并以红点提示首次查看。</text>
    <g transform="translate(346 340)">
      <circle r="175" fill="#211812" stroke="#735033" stroke-width="10"/><circle r="105" fill="#15100d" stroke="#493323" stroke-width="6"/>
      <path d="M-153 84A175 175 0 0 1 -144 -99" fill="none" stroke="#83a15f" stroke-width="24"/>
      <path d="M-124 -123A175 175 0 0 1 47 -169" fill="none" stroke="#e5a23c" stroke-width="25" filter="url(#glow)"/>
      <path d="M76 -158A175 175 0 0 1 173 25" fill="none" stroke="#77736f" stroke-width="24" stroke-dasharray="16 10"/>
      <g fill="#38271a" stroke="#d69946" stroke-width="5"><circle cx="-160" cy="50" r="25"/><circle cx="-160" cy="-55" r="25"/><circle cx="-86" cy="-153" r="25"/><circle cx="20" cy="-174" r="25"/></g>
      <g fill="#343230" stroke="#77736f" stroke-width="5"><circle cx="117" cy="-130" r="25"/><circle cx="170" cy="-30" r="25"/><circle cx="150" cy="92" r="25"/></g>
      <text y="-7" text-anchor="middle" class="cn h white">低级多层</text><text y="22" text-anchor="middle" class="cn small muted">沿环形链推进</text>
    </g>
    <g transform="translate(94 535)">
      <path d="M0 11L11 0H480L491 11V60L480 71H11L0 60Z" fill="url(#dark)" stroke="#d4a054" stroke-width="4"/>
      <path d="M10 17L22 8H222L242 27V45L222 63H22L10 54Z" fill="url(#gold)" stroke="#ffe3a0" stroke-width="3"/>
      <path d="M249 27L269 8H469L481 17V54L469 63H269L249 45Z" fill="url(#purple)" stroke="#d6ace9" stroke-width="3"/>
      <text x="121" y="44" text-anchor="middle" class="cn h white">低级科技</text><text x="370" y="44" text-anchor="middle" class="cn h white">高级科技</text>
    </g>
  </g>

