    <g transform="translate(92 904)"><path d="M0 12L12 0H391L403 12V62L391 74H12L0 62Z" fill="url(#dark)" stroke="#d3a158" stroke-width="4"/><path d="M10 18L23 8H182L199 25V50L182 66H23L10 56Z" fill="url(#gold)" stroke="#ffe2a0" stroke-width="3"/><path d="M204 25L221 8H380L393 18V56L380 66H221L204 50Z" fill="url(#purple)" stroke="#d4a8e7" stroke-width="3"/><text x="102" y="46" text-anchor="middle" class="cn h white">低级科技</text><text x="301" y="46" text-anchor="middle" class="cn h white">高级科技</text></g>
