    <g><circle cx="32" cy="35" r="25" fill="#a85b2a" stroke="#ffd27a" stroke-width="3"/><text x="32" y="43" text-anchor="middle" class="cn num">1</text></g>
    <g><circle cx="63" cy="565" r="25" fill="#bd7827" stroke="#ffd27a" stroke-width="3"/><text x="63" y="573" text-anchor="middle" class="cn num">2</text></g>
    <g><circle cx="312" cy="635" r="25" fill="#477d91" stroke="#bce9fa" stroke-width="3"/><text x="312" y="643" text-anchor="middle" class="cn num">3</text></g>
    <g><circle cx="535" cy="535" r="25" fill="#736269" stroke="#ded2d7" stroke-width="3"/><text x="535" y="543" text-anchor="middle" class="cn num">4</text></g>
    <g><circle cx="500" cy="1195" r="25" fill="#5d8a42" stroke="#d5efb4" stroke-width="3"/><text x="500" y="1203" text-anchor="middle" class="cn num">5</text></g>
    <g><circle cx="530" cy="145" r="25" fill="#9d7835" stroke="#ffe0a0" stroke-width="3"/><text x="530" y="153" text-anchor="middle" class="cn num">6</text></g>
