  </g>

  <!-- 3 节点选择与详情 -->
  <g transform="translate(1585 570)" filter="url(#shadow)">
    <path d="M0 18L18 0H515L533 18V575L515 593H18L0 575Z" fill="url(#paper)" stroke="#477d91" stroke-width="4"/>
    <circle cx="44" cy="45" r="27" fill="#477d91"/><text x="44" y="53" text-anchor="middle" class="cn num">3</text><text x="84" y="53" class="cn pt">点击节点并查看详情</text><path d="M28 78H505" stroke="#91b8c7" stroke-width="2"/>
    <text x="34" y="116" class="cn body">任意节点都可点击；选中后节点高亮，</text><text x="34" y="147" class="cn body">底部详情框切换为该科技的信息。</text>
    <g transform="translate(52 190)"><rect width="428" height="310" rx="20" fill="#f9ecd2" stroke="#9c6a30" stroke-width="4"/>
      <circle cx="87" cy="82" r="58" fill="#241912" stroke="#d89a3c" stroke-width="7" filter="url(#glow)"/><text x="87" y="90" text-anchor="middle" class="cn h white">节点图标</text>
      <text x="170" y="52" class="cn h">科技名　Lv.2/5</text><text x="170" y="91" class="cn body">当前效果：全体攻击 +4%</text><text x="170" y="127" class="cn body">下级效果：全体攻击 +6%</text>
      <path d="M28 160H400" stroke="#c8a674" stroke-width="2"/><text x="28" y="198" class="cn body">状态与不足项在详情框直接显示</text><text x="28" y="235" class="cn small">已满级：仅显示已生效效果，按钮置灰</text><text x="28" y="270" class="cn small">未解锁：分别展示等级/前置/科技点条件</text>
    </g>
    <g transform="translate(34 522)"><rect width="465" height="46" rx="13" fill="#e4f0f4" stroke="#5f92a6" stroke-width="3"/><text x="232" y="30" text-anchor="middle" class="cn body">切换节点时，详情框与升级按钮同步刷新</text></g>
  </g>

