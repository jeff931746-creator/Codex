<svg xmlns="http://www.w3.org/2000/svg" width="887" height="1320" viewBox="0 0 887 1320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38251c"/><stop offset="0.58" stop-color="#21140f"/><stop offset="1" stop-color="#100806"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#75462a"/><stop offset="0.5" stop-color="#3d2014"/><stop offset="1" stop-color="#23110b"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2cc"/><stop offset="0.62" stop-color="#edd19a"/><stop offset="1" stop-color="#d3ad70"/>
    </linearGradient>
    <linearGradient id="paperLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7dc"/><stop offset="1" stop-color="#f0d6a0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff39a"/><stop offset="0.42" stop-color="#efb52f"/><stop offset="1" stop-color="#9e5c12"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdc79"/><stop offset="0.5" stop-color="#e8a737"/><stop offset="1" stop-color="#a75d17"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6bad46"/><stop offset="1" stop-color="#315b29"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5aa4c7"/><stop offset="1" stop-color="#24516f"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a06ab2"/><stop offset="1" stop-color="#533260"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#080302" flood-opacity="0.56"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#32180b" flood-opacity="0.32"/></filter>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#2d190d}.heavy{font-weight:900;paint-order:stroke;stroke-linejoin:round}.title{fill:#fff1c5;stroke:#1a0904;stroke-width:7px}.section{font-size:31px;font-weight:900}.body{font-size:23px;font-weight:800}.small{font-size:19px;font-weight:700}
    </style>
  </defs>

  <rect width="887" height="1320" fill="url(#bg)"/>
  <g opacity=".4"><path d="M0 112H887M0 245H887M0 390H887M0 1180H887" stroke="#725344" stroke-width="10"/><path d="M88 0V1320M799 0V1320M222 0V330M675 0V360" stroke="#604235" stroke-width="16"/><circle cx="444" cy="98" r="75" fill="#e5bd72" opacity=".4"/></g>

  <!-- 标题 -->
  <g filter="url(#shadow)">
    <path d="M224 78H663L706 108V178L663 208H224L181 178V108Z" fill="url(#wood)" stroke="#170a06" stroke-width="9"/>
    <path d="M239 97H648L683 122V165L648 190H239L204 165V122Z" fill="none" stroke="#a77748" stroke-width="5" opacity=".7"/>
    <circle cx="245" cy="143" r="8" fill="#bd8958" stroke="#1d0d08" stroke-width="4"/><circle cx="641" cy="143" r="8" fill="#bd8958" stroke="#1d0d08" stroke-width="4"/>
    <text x="444" y="167" text-anchor="middle" class="heavy title" font-size="64">军团捐献</text>
  </g>
  <g filter="url(#soft)">
    <path d="M89 59H183V224L136 196L89 224Z" fill="#93382d" stroke="#3d160f" stroke-width="7"/><path d="M104 169L96 116L121 133L137 96L155 133L180 116L169 169Z" fill="url(#gold)" stroke="#542610" stroke-width="6"/>
    <rect x="724" y="101" width="81" height="81" rx="12" fill="#8b392e" stroke="#2e110b" stroke-width="7"/><path d="M746 124L783 160M783 124L746 160" stroke="#ffe6ae" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- 建设进度：缩短并将信息集中在进度条周围 -->
  <g filter="url(#shadow)">
    <path d="M64 217H823V455L798 480H89L64 455Z" fill="url(#paper)" stroke="#68452a" stroke-width="7"/>
    <path d="M81 234H806V440L782 463H105L81 440Z" fill="#fff7dc" opacity=".27"/>
    <g transform="translate(120 267)">
      <rect x="0" y="112" width="181" height="38" rx="5" fill="#976b43" stroke="#50351f" stroke-width="5"/><path d="M24 108V45H65V24H103V45H145V108Z" fill="#918f88" stroke="#4a4036" stroke-width="7"/><path d="M47 106V58M83 106V36M121 106V57" stroke="#4f4033" stroke-width="6"/><path d="M101 26L163 44V68L101 52Z" fill="#a4382c" stroke="#4a160f" stroke-width="5"/><path d="M119 45L130 33L139 46L151 38L147 56H121Z" fill="#edbd4e"/><ellipse cx="157" cy="111" rx="29" ry="19" transform="rotate(-27 157 111)" fill="#aaa399" stroke="#504337" stroke-width="6"/><path d="M175 125L207 166" stroke="#704326" stroke-width="12" stroke-linecap="round"/>
    </g>
    <text x="483" y="297" text-anchor="middle" class="heavy" font-size="43">军团建设 Lv.2</text>
    <rect x="345" y="330" width="311" height="37" rx="19" fill="#24120c" stroke="#120806" stroke-width="5"/><rect x="345" y="330" width="204" height="37" rx="19" fill="url(#gold)" stroke="#ffe27d" stroke-width="3"/>
    <text x="673" y="361" class="heavy" font-size="25">1200/2000</text>
    <text x="345" y="412" class="body">距离下一级还需要 800 军团经验</text>
  </g>

  <!-- 等级权益：同一成长轴内对齐 -->
  <g filter="url(#soft)">
    <rect x="64" y="494" width="759" height="215" fill="url(#paperLight)" stroke="#5f3e24" stroke-width="7"/>
    <path d="M254 548H633" stroke="#b58a49" stroke-width="6" stroke-linecap="round"/><circle cx="254" cy="548" r="15" fill="#555b5c"/><circle cx="633" cy="548" r="18" fill="url(#gold)" stroke="#8b5116" stroke-width="4"/>
    <text x="254" y="532" text-anchor="middle" class="heavy" font-size="24">军团等级 Lv.1</text><text x="633" y="532" text-anchor="middle" class="heavy" font-size="24">军团等级 Lv.2</text>
    <circle cx="128" cy="601" r="15" fill="#555b5c"/><text x="160" y="609" class="body">解锁军团商店</text><circle cx="128" cy="660" r="15" fill="#555b5c"/><text x="160" y="668" class="body">解锁集结功能</text>
    <circle cx="498" cy="601" r="17" fill="url(#gold)" stroke="#875016" stroke-width="4"/><path d="M491 601L496 607L507 593" fill="none" stroke="#fff6bd" stroke-width="5" stroke-linecap="round"/><text x="529" y="609" class="body">解锁2级商店物品</text>
    <circle cx="498" cy="660" r="17" fill="url(#gold)" stroke="#875016" stroke-width="4"/><path d="M491 660L496 666L507 652" fill="none" stroke="#fff6bd" stroke-width="5" stroke-linecap="round"/><text x="529" y="668" class="body">集结次数上限 +1</text>
  </g>

  <!-- 捐献主区：主操作卡 + 底部奖励总览 -->
  <g filter="url(#shadow)">
    <path d="M64 722H823V1155L798 1180H89L64 1155Z" fill="url(#paperLight)" stroke="#5f3e24" stroke-width="7"/>
    <path d="M81 739H806V1140L782 1163H105L81 1140Z" fill="#fff7dc" opacity=".28"/>
    <path d="M64 722H823V778H64Z" fill="#f5dfa9" stroke="#5f3e24" stroke-width="5"/>
    <circle cx="105" cy="757" r="29" fill="#fffdf5" stroke="#776044" stroke-width="3"/><text x="105" y="765" text-anchor="middle" class="heavy" font-size="18">排行</text>

    <!-- 主操作卡：物品、数量与按钮属于同一容器 -->
    <g filter="url(#soft)">
      <rect x="137" y="804" width="613" height="205" rx="12" fill="#fff7d9" stroke="#a6783d" stroke-width="5"/>
      <path d="M137 804H750V856H137Z" fill="#e8c27b" stroke="#a6783d" stroke-width="4"/>
      <text x="444" y="839" text-anchor="middle" class="section">捐献物品</text>
    </g>
    <g transform="translate(181 873)" filter="url(#soft)">
      <rect width="112" height="112" rx="9" fill="#fffdf1" stroke="#705333" stroke-width="6"/><path d="M56 18L89 43L77 83L37 91L19 54Z" fill="#61b96b" stroke="#28643a" stroke-width="6"/><path d="M31 70L80 34" stroke="#f1dd57" stroke-width="7" stroke-linecap="round"/><path d="M46 32C34 23 29 12 32 5C45 7 54 14 56 27M60 28C59 14 69 5 83 5C88 18 80 28 64 35" fill="#62c45d" stroke="#28643a" stroke-width="5"/><circle cx="79" cy="72" r="6" fill="#45b7bd"/>
    </g>
    <text x="383" y="916" text-anchor="middle" class="heavy" font-size="31">100 / 1</text>
    <text x="383" y="949" text-anchor="middle" class="small">当前拥有 / 本次需要</text>
    <g filter="url(#soft)"><rect x="529" y="882" width="175" height="82" rx="11" fill="url(#button)" stroke="#5c3316" stroke-width="7"/><rect x="542" y="895" width="149" height="56" fill="none" stroke="#ffe6a1" stroke-width="3" opacity=".75"/><text x="617" y="936" text-anchor="middle" class="heavy" font-size="35">捐 献</text></g>

    <!-- 底部奖励总览：标题与奖励同属一条底栏 -->
    <g filter="url(#soft)">
      <path d="M105 1025H782V1148L765 1165H122L105 1148Z" fill="#edc875" stroke="#9f6e31" stroke-width="5"/>
      <path d="M122 1041H765V1144H122Z" fill="#ffe7a2" opacity=".42"/>
      <text x="444" y="1068" text-anchor="middle" class="heavy" font-size="26">捐献奖励</text>
    </g>
    <g transform="translate(309 1077)"><rect width="78" height="78" rx="9" fill="url(#green)" stroke="#362819" stroke-width="6"/><circle cx="39" cy="36" r="20" fill="url(#gold)" stroke="#7b4914" stroke-width="4"/><path d="M29 38L36 45L52 28" fill="none" stroke="#fff4b2" stroke-width="6" stroke-linecap="round"/><text x="69" y="70" text-anchor="end" class="heavy" font-size="19">20</text></g>
    <g transform="translate(404 1077)"><rect width="78" height="78" rx="9" fill="url(#blue)" stroke="#362819" stroke-width="6"/><path d="M39 12L63 39L39 66L15 39Z" fill="#72d8ff" stroke="#173d59" stroke-width="5"/><text x="39" y="45" text-anchor="middle" class="heavy" font-size="16">EXP</text><text x="69" y="70" text-anchor="end" class="heavy" font-size="19">50</text></g>
    <g transform="translate(499 1077)"><rect width="78" height="78" rx="9" fill="url(#purple)" stroke="#362819" stroke-width="6"/><path d="M15 28H63V64H15Z" fill="#eed5a0" stroke="#674123" stroke-width="4"/><path d="M15 28C7 28 7 16 18 16H60C71 16 71 28 63 28" fill="#f7e3b5" stroke="#674123" stroke-width="4"/><path d="M25 40H54M25 50H50" stroke="#98703e" stroke-width="4" stroke-linecap="round"/><text x="69" y="70" text-anchor="end" class="heavy" font-size="19">1</text></g>
  </g>

  <g opacity=".85"><path d="M337 1243H550V1320H337Z" fill="#5a2c1e"/><path d="M382 1307L399 1264L442 1293L486 1264L503 1307Z" fill="#c69539" opacity=".72"/><path d="M700 1230L829 1193L871 1317L742 1320Z" fill="#e4d1a7" stroke="#6e4b30" stroke-width="7"/><path d="M735 1254L817 1231M746 1285L828 1262M757 1314L839 1292" stroke="#9e8260" stroke-width="6"/></g>
</svg>
