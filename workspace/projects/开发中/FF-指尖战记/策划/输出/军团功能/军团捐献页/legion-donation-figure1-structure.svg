      .heavy { font-weight: 900; paint-order: stroke; stroke-linejoin: round; }
      .title { fill: #fff1c5; stroke: #1a0904; stroke-width: 7px; }
      .section { font-size: 33px; font-weight: 900; }
      .body { font-size: 24px; font-weight: 800; }
      .small { font-size: 20px; font-weight: 700; }
      .tiny { font-size: 17px; font-weight: 700; }
