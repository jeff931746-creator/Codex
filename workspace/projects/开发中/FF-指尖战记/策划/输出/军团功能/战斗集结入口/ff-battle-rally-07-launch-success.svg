<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1525" viewBox="0 0 700 1525">
  <defs>
    <linearGradient id="yellowBtn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff76b"/><stop offset="0.55" stop-color="#f3df26"/><stop offset="1" stop-color="#d5b70f"/></linearGradient>
    <linearGradient id="grayBtn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8170"/><stop offset="0.58" stop-color="#6c6252"/><stop offset="1" stop-color="#4b4235"/></linearGradient>
    <linearGradient id="toast" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2b18" stop-opacity="0.98"/><stop offset="1" stop-color="#1d1009" stop-opacity="0.98"/></linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#070403" flood-opacity="0.72"/></filter>
    <style>
      .cn { font-family: "PingFang SC", "STHeiti", "Microsoft YaHei", sans-serif; font-weight: 900; letter-spacing: 0; paint-order: stroke; stroke-linejoin: round; }
      .tipText { fill: #fff2c1; stroke: #1b0d07; stroke-width: 3px; }
    </style>
  </defs>
  <image href="ff-battle-rally-reference.jpg" x="0" y="0" width="700" height="1525" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(304 1054)" filter="url(#drop)">
    <rect x="0" y="0" width="300" height="64" rx="18" fill="url(#toast)" stroke="#d9a34a" stroke-width="3"/>
    <text x="150" y="28" text-anchor="middle" class="cn tipText" font-size="19">集结已发起</text>
    <text x="150" y="54" text-anchor="middle" class="cn tipText" font-size="19">已通知军团成员确认</text>
  </g>
  <g id="right-actions">
    <g transform="translate(627 1132)" filter="url(#drop)">
      <circle cx="0" cy="0" r="47" fill="url(#grayBtn)" stroke="#3b3026" stroke-width="4"/>
      <circle cx="0" cy="0" r="39" fill="none" stroke="#a99b82" stroke-width="3" opacity="0.85"/>
      <text x="0" y="-7" text-anchor="middle" class="cn" font-size="23" fill="#efe3c5" stroke="none">召集</text>
      <text x="0" y="22" text-anchor="middle" class="cn" font-size="21" fill="#efe3c5" stroke="none">04:58</text>
    </g>
    <g transform="translate(627 1284)" filter="url(#drop)">
      <circle cx="0" cy="0" r="47" fill="url(#yellowBtn)" stroke="#6a5608" stroke-width="4"/>
      <circle cx="0" cy="0" r="39" fill="none" stroke="#fffaa0" stroke-width="3" opacity="0.92"/>
      <text x="0" y="10" text-anchor="middle" class="cn" font-size="28" fill="#3f3404" stroke="none">技能</text>
    </g>
  </g>
</svg>
