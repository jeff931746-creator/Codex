<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1525" viewBox="0 0 980 1525">
  <defs>
    <linearGradient id="panelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2417" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#160d09" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="goldButton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6a1"/>
      <stop offset="0.45" stop-color="#d4902f"/>
      <stop offset="1" stop-color="#7b4315"/>
    </linearGradient>
    <linearGradient id="goldButtonInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3bf"/>
      <stop offset="0.5" stop-color="#c97826"/>
      <stop offset="1" stop-color="#5a2811"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8e35a"/>
      <stop offset="1" stop-color="#3da23c"/>
    </linearGradient>
    <linearGradient id="redBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7f4d"/>
      <stop offset="1" stop-color="#a51d18"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#090605" flood-opacity="0.72"/>
    </filter>
    <filter id="textPop" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.2" flood-color="#120905" flood-opacity="0.95"/>
    </filter>
    <style>
      .cn {
        font-family: "PingFang SC", "STHeiti", "Microsoft YaHei", sans-serif;
        font-weight: 900;
        letter-spacing: 0;
        paint-order: stroke;
        stroke-linejoin: round;
      }
      .label {
        fill: #fff2c1;
        stroke: #1b0d07;
        stroke-width: 4px;
      }
      .small-label {
        fill: #fff2c1;
        stroke: #1b0d07;
        stroke-width: 3px;
      }
      .dark-text {
        fill: #412717;
        stroke: none;
      }
      .soft-text {
        fill: #f5dfb1;
        stroke: none;
      }
      .muted-text {
        fill: #bfa37a;
        stroke: none;
      }
      .note {
        fill: #ffe4a0;
        stroke: none;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="1525" fill="#1b130f"/>
  <image href="ff-battle-rally-reference.jpg" x="0" y="0" width="700" height="1525" preserveAspectRatio="xMidYMid meet"/>

  <!-- Battle-side rally entry: placed in the existing left utility column, below statistics. -->
  <g transform="translate(48 546)" filter="url(#drop)">
    <circle cx="0" cy="0" r="43" fill="#2a1a12" stroke="#070403" stroke-width="5"/>
    <circle cx="0" cy="0" r="37" fill="url(#goldButton)" stroke="#f6d98f" stroke-width="3"/>
    <circle cx="0" cy="0" r="30" fill="url(#goldButtonInner)" stroke="#4c210d" stroke-width="3"/>
    <path d="M-21 2 L4 -13 L4 17 L-21 8 Z" fill="#fff0b3" stroke="#3e1b0c" stroke-width="4" stroke-linejoin="round"/>
    <path d="M4 -13 C19 -13 30 -4 30 2 C30 11 19 18 4 17 Z" fill="#f4be4f" stroke="#3e1b0c" stroke-width="4"/>
    <path d="M-25 4 H-32 C-36 4 -38 7 -38 11 C-38 15 -35 18 -31 18 H-23" fill="none" stroke="#3e1b0c" stroke-width="5" stroke-linecap="round"/>
    <path d="M-13 11 L-4 28" stroke="#3e1b0c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="28" cy="-31" r="17" fill="url(#redBadge)" stroke="#f6d98f" stroke-width="3"/>
    <text x="28" y="-23" text-anchor="middle" class="cn small-label" font-size="19">2</text>
    <text x="0" y="61" text-anchor="middle" class="cn label" font-size="25">集结</text>
    <rect x="-29" y="71" width="58" height="22" rx="10" fill="#23140d" stroke="#efc76e" stroke-width="2"/>
    <text x="0" y="88" text-anchor="middle" class="cn small-label" font-size="16">2/3</text>
  </g>

  <!-- Available-state hint under the boss bar. -->
  <g transform="translate(112 352)" filter="url(#drop)">
    <path d="M18 0 H446 C457 0 466 9 466 20 V48 C466 59 457 68 446 68 H18 C7 68 -2 59 -2 48 V20 C-2 9 7 0 18 0 Z" fill="url(#panelDark)" stroke="#e0b060" stroke-width="3"/>
    <path d="M16 12 H94 C102 12 108 18 108 26 V42 C108 50 102 56 94 56 H16 C8 56 2 50 2 42 V26 C2 18 8 12 16 12 Z" fill="#d08a29" stroke="#4c210d" stroke-width="3"/>
    <path d="M25 33 L43 23 L43 43 L25 37 Z" fill="#fff0b3" stroke="#3e1b0c" stroke-width="3"/>
    <path d="M43 23 C54 23 63 28 63 33 C63 39 54 44 43 43 Z" fill="#f4be4f" stroke="#3e1b0c" stroke-width="3"/>
    <text x="75" y="41" text-anchor="middle" class="cn small-label" font-size="22">可用</text>
    <text x="130" y="30" class="cn label" font-size="24">军团集结</text>
    <text x="130" y="55" class="cn small-label" font-size="19">剩余 2/3 次  冷却已结束</text>
    <text x="447" y="43" text-anchor="end" class="cn small-label" font-size="20">点击发起</text>
  </g>

  <!-- Active rally state: non-blocking combat toast above the skill area. -->
  <g transform="translate(86 1196)" filter="url(#drop)">
    <path d="M16 0 H512 C523 0 532 9 532 20 V74 C532 85 523 94 512 94 H16 C5 94 -4 85 -4 74 V20 C-4 9 5 0 16 0 Z" fill="#24160f" stroke="#d89b45" stroke-width="3"/>
    <rect x="16" y="15" width="72" height="64" rx="12" fill="#c76e2c" stroke="#4c210d" stroke-width="3"/>
    <path d="M34 47 L55 34 L55 60 L34 53 Z" fill="#fff0b3" stroke="#3e1b0c" stroke-width="3"/>
    <path d="M55 34 C68 34 78 40 78 47 C78 54 68 60 55 60 Z" fill="#f4be4f" stroke="#3e1b0c" stroke-width="3"/>
    <text x="108" y="32" class="cn label" font-size="25">集结已发送</text>
    <text x="108" y="60" class="cn small-label" font-size="19">成员确认后传送至当前房间</text>
    <rect x="320" y="24" width="122" height="18" rx="8" fill="#140c08" stroke="#5d3b22" stroke-width="2"/>
    <rect x="320" y="24" width="56" height="18" rx="8" fill="url(#greenBar)"/>
    <text x="381" y="63" text-anchor="middle" class="cn small-label" font-size="18">12/37 响应</text>
    <text x="508" y="47" text-anchor="end" class="cn label" font-size="28">00:29</text>
  </g>

  <!-- Right-side state sheet for the same entrance. -->
  <g transform="translate(720 34)">
    <rect x="0" y="0" width="234" height="1457" rx="12" fill="#efe0c5" stroke="#5b3a24" stroke-width="3"/>
    <text x="18" y="42" class="cn dark-text" font-size="25">战斗集结入口</text>
    <text x="18" y="72" class="cn muted-text" font-size="15">按钮在左侧功能列</text>
    <text x="18" y="94" class="cn muted-text" font-size="15">不遮挡技能和角色</text>

    <g transform="translate(18 110)">
      <rect x="0" y="0" width="198" height="124" rx="8" fill="#f7ead2" stroke="#7b5738" stroke-width="2"/>
      <text x="14" y="30" class="cn dark-text" font-size="20">1. 可发起</text>
      <text x="14" y="58" class="cn muted-text" font-size="15">展示剩余次数和冷却</text>
      <rect x="14" y="76" width="170" height="32" rx="15" fill="#2b1a11" stroke="#d39a48" stroke-width="2"/>
      <circle cx="32" cy="92" r="10" fill="#d08a29"/>
      <text x="50" y="99" class="cn note" font-size="16">集结可用 2/3</text>
    </g>

    <g transform="translate(18 252)">
      <rect x="0" y="0" width="198" height="124" rx="8" fill="#f7ead2" stroke="#7b5738" stroke-width="2"/>
      <text x="14" y="30" class="cn dark-text" font-size="20">2. 冷却中</text>
      <text x="14" y="58" class="cn muted-text" font-size="15">入口保留，按钮置灰</text>
      <rect x="14" y="76" width="170" height="32" rx="15" fill="#493a31" stroke="#7b6a54" stroke-width="2"/>
      <circle cx="32" cy="92" r="10" fill="#8d8172"/>
      <text x="50" y="99" class="cn soft-text" font-size="16">冷却 04:58</text>
    </g>

    <g transform="translate(18 394)">
      <rect x="0" y="0" width="198" height="142" rx="8" fill="#f7ead2" stroke="#7b5738" stroke-width="2"/>
      <text x="14" y="30" class="cn dark-text" font-size="20">3. 集结中</text>
      <text x="14" y="58" class="cn muted-text" font-size="15">显示响应人数和倒计时</text>
      <rect x="14" y="76" width="170" height="18" rx="8" fill="#25160d"/>
      <rect x="14" y="76" width="78" height="18" rx="8" fill="url(#greenBar)"/>
      <text x="14" y="119" class="cn dark-text" font-size="17">12/37 响应  00:29</text>
    </g>

    <g transform="translate(18 554)">
      <rect x="0" y="0" width="198" height="132" rx="8" fill="#f7ead2" stroke="#7b5738" stroke-width="2"/>
      <text x="14" y="30" class="cn dark-text" font-size="20">4. 不可发起</text>
      <text x="14" y="58" class="cn muted-text" font-size="15">权限不足或场景不可用</text>
      <rect x="14" y="78" width="170" height="36" rx="7" fill="#4b3325" stroke="#8b6f54" stroke-width="2"/>
      <text x="99" y="101" text-anchor="middle" class="cn soft-text" font-size="16">当前场景不可集结</text>
    </g>

    <g transform="translate(18 704)">
      <rect x="0" y="0" width="198" height="174" rx="8" fill="#f7ead2" stroke="#7b5738" stroke-width="2"/>
      <text x="14" y="30" class="cn dark-text" font-size="20">5. 收到集结</text>
      <text x="14" y="58" class="cn muted-text" font-size="15">成员弹窗确认后传送</text>
      <rect x="14" y="78" width="170" height="78" rx="9" fill="#2b1a11" stroke="#d39a48" stroke-width="2"/>
      <text x="26" y="106" class="cn note" font-size="16">盟主发起集结</text>
      <text x="26" y="130" class="cn soft-text" font-size="14">前往当前玩法房间</text>
      <rect x="26" y="139" width="58" height="24" rx="8" fill="#c76e2c" stroke="#4c210d" stroke-width="2"/>
      <text x="55" y="157" text-anchor="middle" class="cn label" font-size="14">前往</text>
      <rect x="96" y="139" width="58" height="24" rx="8" fill="#4f4036" stroke="#2a1a12" stroke-width="2"/>
      <text x="125" y="157" text-anchor="middle" class="cn soft-text" font-size="14">拒绝</text>
    </g>

    <g transform="translate(18 912)">
      <rect x="0" y="0" width="198" height="222" rx="8" fill="#3b2417" stroke="#7b5738" stroke-width="2"/>
      <text x="14" y="31" class="cn note" font-size="19">交互口径</text>
      <text x="14" y="64" class="cn soft-text" font-size="15">发起成功才扣次数</text>
      <text x="14" y="91" class="cn soft-text" font-size="15">失败不扣次数</text>
      <text x="14" y="118" class="cn soft-text" font-size="15">失败不进冷却</text>
      <text x="14" y="145" class="cn soft-text" font-size="15">拒绝、超时只影响本人</text>
      <text x="14" y="172" class="cn soft-text" font-size="15">普通成员不可发起</text>
      <text x="14" y="199" class="cn soft-text" font-size="15">不作为招募入口</text>
    </g>
  </g>
</svg>
