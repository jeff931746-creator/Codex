<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1525" viewBox="0 0 700 1525">
  <defs>
    <linearGradient id="yellowBtn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff76b"/><stop offset="0.55" stop-color="#f3df26"/><stop offset="1" stop-color="#d5b70f"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a17" stop-opacity="0.98"/><stop offset="1" stop-color="#1b0f08" stop-opacity="0.98"/></linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#090605" flood-opacity="0.78"/></filter>
    <style>
      .cn { font-family: "PingFang SC", "STHeiti", "Microsoft YaHei", sans-serif; font-weight: 900; letter-spacing: 0; paint-order: stroke; stroke-linejoin: round; }
      .label { fill: #fff2c1; stroke: #1b0d07; stroke-width: 4px; }
      .plain { fill: #f6e6c0; stroke: none; }
    </style>
  </defs>
  <image href="ff-battle-rally-reference.jpg" x="0" y="0" width="700" height="1525" preserveAspectRatio="xMidYMid meet"/>
  <rect x="0" y="0" width="700" height="1525" fill="#080604" opacity="0.24"/>
  <g transform="translate(88 560)" filter="url(#drop)">
