    <rect x="292" y="232" width="166" height="48" rx="13" fill="#4f4036" stroke="#20130c" stroke-width="4"/>
    <text x="375" y="264" text-anchor="middle" class="cn label" font-size="24">拒绝</text>
  </g>
  <g transform="translate(627 1284)" filter="url(#drop)">
