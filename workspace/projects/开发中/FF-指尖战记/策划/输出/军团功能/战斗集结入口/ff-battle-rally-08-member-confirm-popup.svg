    <path d="M34 24 H478 C487 24 494 31 494 40 V92 C494 101 487 108 478 108 H34 C25 108 18 101 18 92 V40 C18 31 25 24 34 24 Z" fill="#2a190e" stroke="#6d4728" stroke-width="2"/>
    <text x="256" y="62" text-anchor="middle" class="cn label" font-size="30">盟主发起集结</text>
    <text x="256" y="94" text-anchor="middle" class="cn label" font-size="21">前往当前玩法房间</text>
